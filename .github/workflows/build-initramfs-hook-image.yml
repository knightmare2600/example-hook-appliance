name: Build Initramfs (Hook Runtime Image)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Kernel Build (Precompiled)"]
    types:
      - completed

env:
  KERNEL_VERSION: 5.10.255

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static cpio gzip ipmitool pciutils util-linux

      - name: Create rootfs layout
        run: |
          mkdir -p initrd/rootfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,dev,root,collector,overlay}

      - name: Install busybox
        run: |
          cp /bin/busybox initrd/rootfs/bin/
          chmod +x initrd/rootfs/bin/busybox

      - name: Create init script
        run: |
          mkdir -p initrd/rootfs
          cat << 'EOF' > initrd/rootfs/init
#!/bin/sh

mount -t proc none /proc
mount -t sysfs none /sys

echo "[hook] initramfs booting"

ip link set lo up

# Run overlay logic if present
if [ -f /overlay/inventory.sh ]; then
  /overlay/inventory.sh
fi

# Run collector if present
if [ -f /collector/collector.py ]; then
  python3 /collector/collector.py
fi

echo "[hook] inventory complete"
poweroff -f
EOF

          chmod +x initrd/rootfs/init

      - name: Copy overlay and collector
        run: |
          cp -r collector initrd/rootfs/ || true
          cp -r overlay initrd/rootfs/ || true

      - name: Build initramfs
        run: |
          cd initrd/rootfs
          find . | cpio -H newc -o | gzip > ../initramfs.cpio.gz

      - name: Upload initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs
          path: initrd/initramfs.cpio.gz

      - name: Publish initramfs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ env.KERNEL_VERSION }}
          files: initrd/initramfs.cpio.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
