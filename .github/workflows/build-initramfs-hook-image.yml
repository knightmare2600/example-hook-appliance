name: Initramfs Build (Hook Runtime Image)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Kernel Build (Precompiled)"]
    types:
      - completed

env:
  KERNEL_VERSION: 5.10.255

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            busybox-static \
            cpio \
            gzip \
            ipmitool \
            pciutils \
            util-linux

      - name: Create rootfs
        run: |
          mkdir -p initrd/rootfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,dev,root,collector,overlay}

      - name: Install busybox
        run: |
          cp /bin/busybox initrd/rootfs/bin/
          chmod +x initrd/rootfs/bin/busybox

      - name: Add init script
        run: |
          cat > initrd/rootfs/init << 'EOF'
#!/bin/sh

mount -t proc none /proc
mount -t sysfs none /sys

echo "[hook] initramfs booting"

ip link set lo up

[ -f /overlay/inventory.sh ] && /overlay/inventory.sh
[ -f /collector/collector.py ] && python3 /collector/collector.py

echo "[hook] done"
poweroff -f
EOF
          chmod +x initrd/rootfs/init

      - name: Copy overlays
        run: |
          cp -r collector initrd/rootfs/
          cp -r overlay initrd/rootfs/

      - name: Build initramfs
        run: |
          cd initrd/rootfs
          find . | cpio -H newc -o | gzip > ../initramfs.cpio.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs
          path: initrd/initramfs.cpio.gz

      - name: Create/Update GitHub Release (attach initramfs)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ env.KERNEL_VERSION }}
          name: Hook Runtime ${{ env.KERNEL_VERSION }}
          files: initrd/initramfs.cpio.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
