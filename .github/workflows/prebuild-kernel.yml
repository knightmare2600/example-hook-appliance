name: Kernel Build (Precompiled)

on:
  workflow_dispatch:

env:
  KERNEL_VERSION: 5.10.255

jobs:
  kernel:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            out: amd64
          - arch: arm64
            out: arm64

    steps:
      - name: Install build deps (THIS is where make belongs)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make gcc g++ bc bison flex \
            libssl-dev libelf-dev build-essential \
            curl xz-utils git

      - name: Fetch kernel
        run: |
          curl -LO https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-${KERNEL_VERSION}.tar.xz
          tar -xf linux-${KERNEL_VERSION}.tar.xz
          mv linux-${KERNEL_VERSION} linux

      - name: Configure kernel
        run: |
          cd linux
          cp ../configs/${{ matrix.out }}.config .config || make defconfig
          make ARCH=${{ matrix.arch }} olddefconfig

      - name: Build kernel
        run: |
          cd linux
          make -j$(nproc) ARCH=${{ matrix.arch }}

      - name: Package kernel
        run: |
          tar -czf kernel-${{ matrix.out }}.tar.gz linux/arch/${{ matrix.arch }}/boot

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.out }}
          path: kernel-${{ matrix.out }}.tar.gz
