name: Kernel Build (Clean Artifacts)

on:
  workflow_dispatch:

env:
  KERNEL_VERSION: 5.10.255

jobs:
  kernel:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            kernel_arch: x86_64
            image_path: arch/x86/boot/bzImage

          - name: arm64
            kernel_arch: arm64
            image_path: arch/arm64/boot/Image

    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            curl xz-utils git

      - name: Fetch kernel
        run: |
          curl -LO https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-${KERNEL_VERSION}.tar.xz
          tar -xf linux-${KERNEL_VERSION}.tar.xz
          mv linux-${KERNEL_VERSION} linux

      - name: Configure kernel
        run: |
          cd linux
          make defconfig
          make ARCH=${{ matrix.kernel_arch }} olddefconfig

      - name: Build kernel
        run: |
          cd linux
          make -j$(nproc) ARCH=${{ matrix.kernel_arch }}

      - name: Package kernel artifact
        run: |
          mkdir -p out

          tar -czf out/kernel-${{ matrix.name }}.tar.gz \
            -C linux \
            ${{ matrix.image_path }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.name }}
          path: out/kernel-${{ matrix.name }}.tar.gz
