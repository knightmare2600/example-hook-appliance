name: Kernel Build (Precompiled)

on:
  workflow_dispatch:

env:
  KERNEL_VERSION: 5.10.255

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            kernel: amd64
          - arch: arm64
            kernel: arm64

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ bc bison flex libssl-dev libelf-dev build-essential curl xz-utils git kmod cpio rsync gcc-aarch64-linux-gnu

      - name: Fetch kernel source
        run: |
          curl -LO https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-${KERNEL_VERSION}.tar.xz
          tar -xf linux-${KERNEL_VERSION}.tar.xz
          mv linux-${KERNEL_VERSION} linux

      - name: Configure kernel
        run: |
          cd linux
          if [[ "${{ matrix.kernel }}" == "arm64" ]]; then
            export ARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
          else
            export ARCH=x86_64
          fi
          if [[ -f ../configs/${{ matrix.kernel }}.config ]]; then
            cp ../configs/${{ matrix.kernel }}.config .config
          else
            make defconfig
          fi
          make olddefconfig

      - name: Build kernel
        run: |
          cd linux
          if [[ "${{ matrix.kernel }}" == "arm64" ]]; then
            export ARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
          else
            export ARCH=x86_64
          fi
          make -j$(nproc)
          # Build loadable kernel modules
          make modules -j$(nproc)

      - name: Package kernel and modules
        run: |
          mkdir -p dist
          cd linux
          if [[ "${{ matrix.kernel }}" == "arm64" ]]; then
            export ARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
            cp arch/arm64/boot/Image.gz ../dist/kernel-arm64
          else
            export ARCH=x86_64
            cp arch/x86/boot/bzImage ../dist/kernel-amd64
          fi
          # Install modules into staging directory
          make modules_install INSTALL_MOD_PATH=../dist
          cd ..
          echo
          echo "=== DIST CONTENTS ==="
          find dist | head -100
          tar -czf kernel-${{ matrix.kernel }}.tar.gz -C dist .

      - name: Verify packaged modules
        run: |
          echo
          echo "=== VERIFY KERNEL PACKAGE ==="
          tar -tzf kernel-${{ matrix.kernel }}.tar.gz | head -50

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.kernel }}
          path: kernel-${{ matrix.kernel }}.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ env.KERNEL_VERSION }}
          name: Kernel ${{ env.KERNEL_VERSION }}
          files: |
            kernel-amd64.tar.gz
            kernel-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
