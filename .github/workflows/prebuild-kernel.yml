name: Prebuild Hook Kernels

on:
  workflow_dispatch:

env:
  HOOK_VERSION: v0.11.1
  DO_PUSH: no

jobs:
  kernel:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: hook-default-amd64
            kernel_arch: amd64
          - arch: hook-default-arm64
            kernel_arch: arm64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Clone Hook
        run: |
          git clone --depth=1 --branch ${HOOK_VERSION} https://github.com/tinkerbell/hook.git
      - name: Patch missing make dependency
        run: |
          cd hook
          sed -i 's/crossbuild-essential-amd64/crossbuild-essential-amd64 make/' osie/kernel/Dockerfile
          sed -i 's/crossbuild-essential-arm64/crossbuild-essential-arm64 make/' osie/kernel/Dockerfile
          echo "===== Dockerfile ====="
          cat osie/kernel/Dockerfile
      - name: Build kernel
        env:
          KERNEL_ARCH: ${{ matrix.kernel_arch }}
        run: |
          cd hook
          ./build.sh kernel ${{ matrix.arch }}
      - name: Show built images
        run: |
          docker images
      - name: Export built kernel image
        run: |
          mkdir -p /tmp/hook-kernel-cache
          IMAGE_ID=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "hook-kernel" | head -n1)
          echo "Exporting ${IMAGE_ID}"
          docker save "${IMAGE_ID}" -o /tmp/hook-kernel-cache/${{ matrix.kernel_arch }}-kernel.tar
      - name: Save kernel cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/hook-kernel-cache
          key: hook-kernel-${{ matrix.kernel_arch }}-${{ env.HOOK_VERSION }}
