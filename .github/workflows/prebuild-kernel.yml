name: Prebuild Hook Kernels

on:
  workflow_dispatch:

env:
  HOOK_VERSION: v0.11.1

jobs:
  kernel:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - hook-default-amd64
          - hook-default-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Clone Hook
        run: |
          git clone --depth=1 --branch ${HOOK_VERSION} https://github.com/tinkerbell/hook.git
      - name: Build kernel
        run: |
          cd hook
          ./build.sh kernel ${{ matrix.arch }}
      - name: Export kernel image
        run: |
          mkdir -p /tmp/hook-kernel-cache
          docker save  quay.io/tinkerbell/hook-kernel:5.10.255-70151c3e > /tmp/hook-kernel-cache/kernel.tar
      - name: Save kernel cache
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/hook-kernel-cache
          key: hook-kernel-${{ matrix.arch }}-${{ env.HOOK_VERSION }}
