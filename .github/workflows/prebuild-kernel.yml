name: Prebuild Hook Kernels

on:
  workflow_dispatch:

env:
  HOOK_VERSION: v0.11.1
  DO_PUSH: no

jobs:
  kernel:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: hook-default-amd64
            kernel_arch: x86_64
          - arch: hook-default-arm64
            kernel_arch: arm64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies (FIXES your make error)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            gcc \
            g++ \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            curl \
            xz-utils \
            git \
            build-essential

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone Hook
        run: |
          git clone --depth=1 --branch ${HOOK_VERSION} https://github.com/tinkerbell/hook.git

      - name: Build kernel
        run: |
          cd hook
          export KERNEL_ARCH=${{ matrix.kernel_arch }}

          echo "Building for ${KERNEL_ARCH}"

          # Ensure correct kernel build path
          ./build.sh kernel ${{ matrix.arch }}

      - name: Show images
        run: docker images

      - name: Export kernel image
        run: |
          mkdir -p /tmp/hook-kernel-cache

          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep hook-kernel | head -n1)

          echo "Exporting: $IMAGE"
          docker save "$IMAGE" -o /tmp/hook-kernel-cache/${{ matrix.kernel_arch }}-kernel.tar

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/hook-kernel-cache
          key: hook-kernel-${{ matrix.kernel_arch }}-${{ env.HOOK_VERSION }}
