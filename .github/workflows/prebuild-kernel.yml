name: Prebuild Hook Kernels

on:
  workflow_dispatch:

env:
  HOOK_VERSION: v0.11.1

jobs:
  kernel:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - hook-default-amd64
          - hook-default-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone Hook
        run: |
          git clone --depth=1 --branch ${HOOK_VERSION} https://github.com/tinkerbell/hook.git

      #
      # FIX: hook's kernel Dockerfile is missing 'make'
      # so patch it before build.sh runs.
      #
      - name: Patch kernel Dockerfile
        run: |
          cd hook

          sed -i '/apt.*install/ s/$/ make/' osie/kernel/Dockerfile

          echo "===== Patched Dockerfile ====="
          cat osie/kernel/Dockerfile

      - name: Build kernel
        run: |
          cd hook
          ./build.sh kernel ${{ matrix.arch }}

      - name: List built kernel images
        run: |
          docker images | grep hook-kernel || true

      - name: Export kernel image
        run: |
          mkdir -p /tmp/hook-kernel-cache

          IMAGE_ID=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "hook-kernel" | head -n1)

          echo "Saving ${IMAGE_ID}"

          docker save "${IMAGE_ID}" \
            -o /tmp/hook-kernel-cache/${{ matrix.arch }}-kernel.tar

      - name: Save kernel cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/hook-kernel-cache
          key: hook-kernel-${{ matrix.arch }}-${{ env.HOOK_VERSION }}
