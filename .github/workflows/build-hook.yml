name: Build Hook Appliance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'overlay/**'
      - '.github/workflows/build-hook.yml'

env:
  HOOK_VERSION: v0.11.1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache LinuxKit
        uses: actions/cache@v4
        with:
          path: |
            hook/cache
          key: linuxkit-${{ runner.os }}-${{ hashFiles('hook/build.sh') }}
      - name: Clone Hook
        run: |
          if [ ! -d hook ]; then
            git clone --depth=1 --branch ${HOOK_VERSION} https://github.com/tinkerbell/hook.git
          fi
      - name: Restore prebuilt kernel cache
        uses: actions/cache@v4
        with:
          path: |
            hook/out/kernel
            hook/cache/docker
          key: hook-kernel-amd64-${{ env.HOOK_VERSION }}-5.10.255
      - name: Build kernel only if missing
        run: |
          cd hook
          if docker image inspect quay.io/tinkerbell/hook-kernel:5.10.255-70151c3e >/dev/null 2>&1; then
            echo "Kernel already present locally"
          else
            echo "Building kernel..."
            ./build.sh kernel hook-default-amd64
          fi
      - name: Copy overlay files
        run: |
          mkdir -p hook/files/etc/profile.d
          mkdir -p hook/files/etc/init.d
          cp overlay/local.sh hook/files/etc/profile.d/local.sh
          cp overlay/002-banner.sh hook/files/etc/init.d/002-banner.sh
      - name: Build Hook image
        run: |
          cd hook
          ./build.sh build hook-default-amd64
      - name: Show output files
        run: |
          find hook -type f | grep -E 'hook-(kernel|initrd.img|cmdline)$'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-appliance
          path: |
            hook/out/linuxkit-hook-default-amd64/hook-kernel
            hook/out/linuxkit-hook-default-amd64/hook-initrd.img
            hook/out/linuxkit-hook-default-amd64/hook-cmdline
