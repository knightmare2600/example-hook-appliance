name: Hook Build (Using Prebuilt Kernel)

on:
  workflow_dispatch:

jobs:
  hook:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: hook-default-amd64
            kernel: amd64
          - arch: hook-default-arm64
            kernel: arm64

    steps:
      - name: Checkout Hook
        uses: actions/checkout@v4

      # TEMPORARY: hardcoded kernel build run-id
      # Replace with GitHub Releases / artifact registry later
      - name: Download prebuilt kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.kernel }}
          run-id: 25605053942
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract kernel into Hook cache
        run: |
          mkdir -p hook/cache/kernel
          tar -xzf kernel-${{ matrix.kernel }}.tar.gz -C hook/cache/kernel

      - name: Build Hook (NO kernel build happens now)
        run: |
          cd hook
          export HOOK_KERNEL_PREBUILT=1
          export KERNEL_PATH=cache/kernel
          ./build.sh image ${{ matrix.arch }}

      - name: Show result images
        run: docker images
