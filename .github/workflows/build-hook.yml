name: Hook Build (Using Prebuilt Kernel)

on:
  workflow_dispatch:

env:
  KERNEL_VERSION: 5.10.255

jobs:
  hook:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: hook-default-amd64
            kernel: amd64
          - arch: hook-default-arm64
            kernel: arm64

    steps:
      - name: Checkout Hook
        uses: actions/checkout@v4

      - name: Download prebuilt kernel (from GitHub Release)
        run: |
          curl -L -o kernel-${{ matrix.kernel }}.tar.gz https://github.com/knightmare2600/example-hook-appliance/releases/download/kernel-${KERNEL_VERSION}/kernel-${{ matrix.kernel }}.tar.gz

      - name: Debug repo structure
        run: |
          ls -R

      - name: Extract kernel into Hook cache
        run: |
          mkdir -p hook/cache/kernel
          tar -xzf kernel-${{ matrix.kernel }}.tar.gz -C hook/cache/kernel

      - name: Build Hook (NO kernel build happens now)
        run: |
          cd hook
          export HOOK_KERNEL_PREBUILT=1
          export KERNEL_PATH=cache/kernel
          ./build.sh image ${{ matrix.arch }}

      - name: Show result images
        run: docker images
