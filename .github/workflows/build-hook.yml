name: Build Hook Appliance (Optimised)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      HOOK_VERSION: v0.11.1
      DO_PUSH: "no"
      KERNEL_ARCH: amd64
      KERNEL_VERSION: "5.10.255"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔥 Docker layer caching (BIG speedup)
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: hook-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            hook-build-${{ runner.os }}-

      # 🔥 Pre-pull kernel so Hook doesn't waste time resolving tags
      - name: Pre-pull kernel image (avoid missing manifests)
        run: |
          docker pull quay.io/tinkerbell/hook-kernel:5.10.255-70151c3e || true

      # 🔥 Build kernel explicitly (fix missing make + deterministic)
      - name: Build kernel first (fix missing make issue)
        run: |
          cd hook || true
          ./build.sh kernel hook-default-amd64

      # 🔥 Build full image
      - name: Build Hook appliance
        run: |
          cd hook
          ./build.sh build hook-default-amd64

      # 🔥 Show outputs safely (fix your missing path issue)
      - name: List outputs
        run: |
          find hook/out -type d -maxdepth 4 || true
