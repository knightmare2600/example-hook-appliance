      - name: Install provisioning packages
        run: |
          sudo chroot rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive

            apt-get update

            apt-get install -y --no-install-recommends \
              linux-base \
              initramfs-tools \
              systemd \
              systemd-sysv \
              dbus \
              dbus-broker \
              libpam-systemd \
              udev \
              kmod \
              util-linux \
              login \
              passwd \
              bash \
              iproute2 \
              iputils-ping \
              ethtool \
              curl \
              wget \
              jq \
              ca-certificates \
              openssh-server \
              openssh-client \
              tmux \
              vim-tiny \
              less \
              tar \
              gzip \
              bzip2 \
              xz-utils \
              pciutils \
              usbutils \
              dmidecode \
              lshw \
              smartmontools \
              nvme-cli \
              mdadm \
              ipmitool \
              python3 \
              kbd \
              console-setup \
              keyboard-configuration \
              console-data \
              acpid \
              minicom \
              lrzsz \
              ckermit \
              systemd-resolved \
              firmware-linux-free \
              firmware-realtek \
              firmware-misc-nonfree \
              isc-dhcp-client \
              net-tools \
              telnet \
              nmap \
              grc

            apt-get clean
          "
