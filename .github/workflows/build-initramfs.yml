name: Build Provisioning Runtime

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Kernel Build (Precompiled)"]
    types:
      - completed

env:
  KERNEL_VERSION: 5.10.255

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y debootstrap cpio gzip xz-utils

      - name: Create staging directories
        run: |
          mkdir -p stage

      - name: Build minimal Ubuntu rootfs
        run: |
          sudo debootstrap --arch=amd64 --variant=minbase jammy stage/amd64

      - name: Install provisioning packages
        run: |
          sudo chroot stage/amd64 /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y bash busybox-static iproute2 isc-dhcp-client iputils-ping curl wget ca-certificates openssh-server tmux vim-tiny grc pciutils usbutils dmidecode lshw ipmitool mdadm smartmontools nvme-cli jq python3 python3-pip
            apt-get clean"

      - name: Set root password
        run: |
          echo 'root:root' | sudo chroot stage/amd64 chpasswd

      - name: Install custom init
        run: |
          sudo cp initramfs/init stage/amd64/init
          sudo chmod +x stage/amd64/init

      - name: Install MOTD
        run: |
          sudo cp initramfs/motd stage/amd64/etc/motd

      - name: Install bashrc
        run: |
          sudo cp initramfs/bashrc stage/amd64/root/.bashrc

      - name: Copy collector and overlay
        run: |
          sudo mkdir -p stage/amd64/collector
          sudo mkdir -p stage/amd64/overlay

          sudo cp -r collector/* stage/amd64/collector/ || true
          sudo cp -r overlay/* stage/amd64/overlay/ || true

      - name: Enable SSH runtime
        run: |
          sudo mkdir -p stage/amd64/var/run/sshd

      - name: Build initramfs archive
        run: |
          cd stage/amd64

          sudo find . -print0 | sudo cpio --null -ov --format=newc | gzip -9 > ../../initramfs-amd64.cpio.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-amd64
          path: initramfs-amd64.cpio.gz

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ env.KERNEL_VERSION }}
          files: initramfs-amd64.cpio.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
