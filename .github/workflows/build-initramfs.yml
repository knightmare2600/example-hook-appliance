name: Build Provisioning Runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    env:
      DEBIAN_RELEASE: trixie
      NETBOOT_URL: https://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images/netboot/debian-installer/amd64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap cpio gzip xz-utils zstd curl wget rsync file

      - name: Download Debian netboot kernel + initrd
        run: |
          mkdir -p upstream
          curl -L -o upstream/linux ${NETBOOT_URL}/linux
          curl -L -o upstream/initrd.img ${NETBOOT_URL}/initrd.gz
          chmod +x upstream/linux

      - name: Extract upstream initrd
        run: |
          mkdir -p initrd-tree
          cd initrd-tree
          FILETYPE=$(file ../upstream/initrd.img)
          echo "$FILETYPE"
          if echo "$FILETYPE" | grep -qi gzip; then
            gzip -dc ../upstream/initrd.img | sudo cpio -idmv
          elif echo "$FILETYPE" | grep -qi xz; then
            xz -dc ../upstream/initrd.img | sudo cpio -idmv
          elif echo "$FILETYPE" | grep -qi zstandard; then
            zstd -dc ../upstream/initrd.img | sudo cpio -idmv
          else
            echo "Unknown initrd compression"
            exit 1
          fi

      - name: Build provisioning rootfs
        run: |
          sudo debootstrap --arch=amd64 --variant=minbase --include=bash,coreutils,util-linux,procps,iproute2,isc-dhcp-client,python3 trixie rootfs http://deb.debian.org/debian

      - name: Mount chroot filesystems
        run: |
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys rootfs/sys

      - name: Install provisioning packages
        run: |
          sudo chroot rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y \
              bash \
              busybox-static \
              iproute2 \
              net-tools \
              isc-dhcp-client \
              ifupdown \
              iputils-ping \
              curl \
              wget \
              jq \
              ca-certificates \
              openssh-server \
              openssh-client \
              ssh \
              tmux \
              vim-tiny \
              pciutils \
              usbutils \
              dmidecode \
              lshw \
              mdadm \
              smartmontools \
              nvme-cli \
              python3 \
              python3-pip \
              ethtool \
              kmod \
              kbd \
              console-setup \
              fbset \
              acpid \
              less \
              file \
              rsync \
              tar \
              gzip \
              bzip2 \
              xz-utils \
              firmware-linux \
              firmware-linux-free \
              firmware-misc-nonfree \
              firmware-realtek \
              firmware-iwlwifi \
              firmware-amd-graphics \
              firmware-intel-graphics
            apt-get clean
          "
          
      - name: Verify installed tools
        run: |
          sudo chroot rootfs /bin/bash -c "
            echo '=== TOOL CHECK ==='

            for x in \
              ip \
              dhclient \
              curl \
              wget \
              sshd \
              tmux \
              vim \
              lspci \
              dmidecode \
              nvme \
              smartctl \
              modprobe \
              lsmod \
              ethtool \
              ifconfig
            do
              echo
              echo \"=== \$x ===\"
              which \$x || true
            done
          "

      - name: Unmount chroot filesystems
        run: |
          sudo umount rootfs/dev || true
          sudo umount rootfs/proc || true
          sudo umount rootfs/sys || true

      - name: Copy runtime into initrd
        run: |
          sudo rsync -a rootfs/ initrd-tree/

      - name: Install custom init
        run: |
          sudo cp initramfs/init initrd-tree/init
          sudo chmod +x initrd-tree/init

      - name: Install MOTD and shell config
        run: |
          sudo cp initramfs/motd initrd-tree/etc/motd || true
          sudo cp initramfs/bashrc initrd-tree/root/.bashrc || true

      - name: Copy collector and overlay
        run: |
          sudo mkdir -p initrd-tree/collector
          sudo mkdir -p initrd-tree/overlay
          sudo cp -r collector/* initrd-tree/collector/ || true
          sudo cp -r overlay/* initrd-tree/overlay/ || true

      - name: Configure root account
        run: |
          echo 'root:root' | sudo chroot initrd-tree chpasswd || true

      - name: Enable SSH login
        run: |
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' initrd-tree/etc/ssh/sshd_config || true
          sudo sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' initrd-tree/etc/ssh/sshd_config || true

      - name: Create runtime directories
        run: |
          sudo mkdir -p initrd-tree/run/sshd
          sudo mkdir -p initrd-tree/var/run/sshd
          sudo mkdir -p initrd-tree/root

      - name: Create device nodes
        run: |
          sudo mknod -m 622 initrd-tree/dev/console c 5 1 || true
          sudo mknod -m 666 initrd-tree/dev/null c 1 3 || true
          sudo mknod -m 666 initrd-tree/dev/tty c 5 0 || true

      - name: Build final initramfs
        run: |
          cd initrd-tree
          sudo find . -print0 | \
            sudo cpio --null -ov --format=newc | \
            gzip -9 > ../initramfs-amd64.cpio.gz

      - name: Upload initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-amd64
          path: |
            initramfs-amd64.cpio.gz
            upstream/linux

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: provisioning-runtime
          files: |
            initramfs-amd64.cpio.gz
            upstream/linux
        env:
          GITHUB_TOKEN: ${{ github.token }}
