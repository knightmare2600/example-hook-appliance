name: Build Provisioning Runtime

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  RELEASE_VERSION: 0.1.0

jobs:

  ##########################################################################
  # Multi-architecture build
  ##########################################################################

  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - arch: amd64
            kernel_version: 6.12.73+deb13-amd64
            kernel_deb: linux-image-6.12.73+deb13-amd64_6.12.73-1_amd64.deb
            kernel_url: http://ftp.uk.debian.org/debian/pool/main/l/linux-signed-amd64/linux-image-6.12.73+deb13-amd64_6.12.73-1_amd64.deb

          - arch: arm64
            kernel_version: 6.12.73+deb13-arm64
            kernel_deb: linux-image-6.12.73+deb13-arm64_6.12.73-1_arm64.deb
            kernel_url: http://ftp.uk.debian.org/debian/pool/main/l/linux-signed-arm64/linux-image-6.12.73+deb13-arm64_6.12.73-1_arm64.deb

    env:
      DEBIAN_RELEASE: trixie
      DEBIAN_MIRROR: http://deb.debian.org/debian

      SMB_DOMAIN: jukebox.internal
      SMB_USERNAME: Administrator
      SMB_SHARE: DeployTools

    steps:

      ######################################################################
      # Checkout
      ######################################################################

      - name: Checkout repo
        uses: actions/checkout@v4

      ######################################################################
      # Build dependencies
      ######################################################################

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            cpio \
            gzip \
            xz-utils \
            zstd \
            rsync \
            wget \
            curl \
            dpkg \
            initramfs-tools \
            linux-base

      ######################################################################
      # Working directories
      ######################################################################

      - name: Create working directories
        run: |
          rm -rf rootfs initrd-tree

          mkdir -p rootfs
          mkdir -p initrd-tree

      ######################################################################
      # Bootstrap Debian
      ######################################################################

      - name: Build Debian rootfs
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then

            sudo debootstrap \
              --foreign \
              --arch=arm64 \
              --variant=minbase \
              ${DEBIAN_RELEASE} \
              rootfs \
              ${DEBIAN_MIRROR}

            sudo cp /usr/bin/qemu-aarch64-static \
              rootfs/usr/bin/

            sudo chroot rootfs \
              /debootstrap/debootstrap \
              --second-stage

          else

            sudo debootstrap \
              --arch=amd64 \
              --variant=minbase \
              ${DEBIAN_RELEASE} \
              rootfs \
              ${DEBIAN_MIRROR}

          fi

      ######################################################################
      # Mount chroot filesystems
      ######################################################################

      - name: Mount chroot filesystems
        run: |
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys rootfs/sys
          sudo mount --bind /dev/pts rootfs/dev/pts

      ######################################################################
      # Apt sources
      ######################################################################

      - name: Configure apt sources
        run: |
          cat << EOF | sudo tee rootfs/etc/apt/sources.list
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
          EOF

      ######################################################################
      # Download kernel package
      ######################################################################

      - name: Download kernel package
        run: |
          rm -f ${{ matrix.kernel_deb }}

          wget -O ${{ matrix.kernel_deb }} \
            ${{ matrix.kernel_url }}

          sha256sum ${{ matrix.kernel_deb }}

      ######################################################################
      # Install runtime packages
      ######################################################################

      - name: Install runtime packages
        run: |
          sudo chroot rootfs /bin/bash -c "

            export DEBIAN_FRONTEND=noninteractive

            apt-get update

            apt-get install -y --no-install-recommends \

              systemd \
              systemd-sysv \
              dbus \
              dbus-broker \
              udev \
              kmod \
              util-linux \
              mount \
              login \
              passwd \
              bash \
              procps \
              less \
              vim-tiny \
              jq \
              curl \
              wget \
              ca-certificates \
              iproute2 \
              iputils-ping \
              isc-dhcp-client \
              ethtool \
              net-tools \
              dnsutils \
              openssh-server \
              openssh-client \
              pciutils \
              usbutils \
              dmidecode \
              lshw \
              smartmontools \
              nvme-cli \
              mdadm \
              ipmitool \
              python3 \
              python3-requests \
              cifs-utils \
              smbclient \
              locales \
              localepurge \
              firmware-linux-free \
              firmware-realtek \
              firmware-misc-nonfree

            apt-get clean
          "

      ######################################################################
      # Configure locales
      ######################################################################

      - name: Configure locales
        run: |
          cat << EOF | sudo tee rootfs/etc/locale.gen
          en_GB.UTF-8 UTF-8
          da_DK.UTF-8 UTF-8
          de_DE.UTF-8 UTF-8
          EOF

          sudo chroot rootfs locale-gen

      ######################################################################
      # Configure localepurge
      ######################################################################

      - name: Configure localepurge
        run: |
          cat << EOF | sudo tee rootfs/etc/locale.nopurge
          MANDELETE
          DONTBOTHERNEWLOCALE
          SHOWFREEDSPACE
          en_GB.UTF-8
          da_DK.UTF-8
          de_DE.UTF-8
          EOF

      ######################################################################
      # Install kernel package
      ######################################################################

      - name: Install kernel package
        run: |
          sudo cp ${{ matrix.kernel_deb }} rootfs/root/

          sudo chroot rootfs dpkg -i \
            /root/${{ matrix.kernel_deb }}

      ######################################################################
      # Generate depmod
      ######################################################################

      - name: Generate depmod
        run: |
          sudo chroot rootfs depmod -a \
            ${{ matrix.kernel_version }}

      ######################################################################
      # Remove duplicate boot kernel
      ######################################################################

      - name: Remove embedded boot kernel
        run: |
          sudo rm -f rootfs/boot/vmlinuz-* || true
          sudo rm -f rootfs/boot/initrd.img-* || true

      ######################################################################
      # Configure networking
      ######################################################################

      - name: Configure networking
        run: |
          sudo mkdir -p rootfs/etc/systemd/network

          cat << EOF | sudo tee \
            rootfs/etc/systemd/network/20-wired.network
          [Match]
          Name=eth*

          [Network]
          DHCP=yes
          EOF

          cat << EOF | sudo tee rootfs/etc/resolv.conf
          nameserver 1.1.1.1
          nameserver 8.8.8.8
          EOF

      ######################################################################
      # Configure root account
      ######################################################################

      - name: Configure root account
        run: |
          echo 'root:root' | sudo chroot rootfs chpasswd

      ######################################################################
      # Configure SSH
      ######################################################################

      - name: Configure SSH
        run: |
          sudo sed -i \
            's/^#PermitRootLogin.*/PermitRootLogin yes/' \
            rootfs/etc/ssh/sshd_config

          sudo sed -i \
            's/^#PasswordAuthentication.*/PasswordAuthentication yes/' \
            rootfs/etc/ssh/sshd_config

      ######################################################################
      # Configure tty autologin
      ######################################################################

      - name: Configure tty autologin
        run: |
          sudo mkdir -p \
            rootfs/etc/systemd/system/getty@tty1.service.d

          cat << EOF | sudo tee \
            rootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I \$TERM
          EOF

      ######################################################################
      # Install hardware collector
      ######################################################################

      - name: Install hardware collector
        run: |
          sudo install -m755 \
            scripts/hwcollect.sh \
            rootfs/usr/local/bin/hwcollect.sh

      ######################################################################
      # Install SMB uploader
      ######################################################################

      - name: Install SMB uploader
        run: |
          sudo install -m755 \
            scripts/smbupload.sh \
            rootfs/usr/local/bin/smbupload.sh

      ######################################################################
      # Install services
      ######################################################################

      - name: Install services
        run: |

          cat << EOF | sudo tee \
            rootfs/etc/systemd/system/hwcollect.service
          [Unit]
          Description=Hardware Inventory Collection
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/hwcollect.sh

          [Install]
          WantedBy=multi-user.target
          EOF

          cat << EOF | sudo tee \
            rootfs/etc/systemd/system/smbupload.service
          [Unit]
          Description=Upload inventory to SMB share
          After=hwcollect.service
          Requires=hwcollect.service

          [Service]
          Type=oneshot
          StandardInput=tty
          StandardOutput=journal+console
          ExecStart=/usr/local/bin/smbupload.sh

          [Install]
          WantedBy=multi-user.target
          EOF

      ######################################################################
      # Enable services
      ######################################################################

      - name: Enable services
        run: |
          sudo chroot rootfs systemctl enable ssh
          sudo chroot rootfs systemctl enable systemd-networkd
          sudo chroot rootfs systemctl enable hwcollect.service
          sudo chroot rootfs systemctl enable smbupload.service
          sudo chroot rootfs systemctl set-default multi-user.target

      ######################################################################
      # Cleanup image
      ######################################################################

      - name: Cleanup image
        run: |
          sudo chroot rootfs /bin/bash -c "

            apt-get autoremove -y
            apt-get clean

            rm -rf /var/lib/apt/lists/*
            rm -rf /usr/share/doc/*
            rm -rf /usr/share/man/*
            rm -rf /usr/share/info/*
            rm -rf /tmp/*
          "

      ######################################################################
      # Unmount chroot filesystems
      ######################################################################

      - name: Unmount chroot filesystems
        run: |
          sudo umount rootfs/dev/pts || true
          sudo umount rootfs/dev || true
          sudo umount rootfs/proc || true
          sudo umount rootfs/sys || true

      ######################################################################
      # Copy rootfs
      ######################################################################

      - name: Copy rootfs
        run: |
          sudo rsync -aHAX \
            --numeric-ids \
            --exclude=/proc/* \
            --exclude=/sys/* \
            --exclude=/dev/* \
            --exclude=/run/* \
            --exclude=/tmp/* \
            rootfs/ initrd-tree/

      ######################################################################
      # Bootstrap init
      ######################################################################

      - name: Install bootstrap init
        run: |
          cat << 'EOF' | sudo tee initrd-tree/init
          #!/bin/sh

          mount -t devtmpfs devtmpfs /dev
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t tmpfs tmpfs /run
          mount -t tmpfs tmpfs /tmp

          mkdir -p /dev/pts

          mount -t devpts devpts /dev/pts

          exec /lib/systemd/systemd
          EOF

          sudo chmod +x initrd-tree/init

      ######################################################################
      # Runtime directories
      ######################################################################

      - name: Create runtime directories
        run: |
          sudo mkdir -p initrd-tree/run
          sudo mkdir -p initrd-tree/tmp
          sudo mkdir -p initrd-tree/root
          sudo mkdir -p initrd-tree/var/run/sshd
          sudo mkdir -p initrd-tree/run/sshd

      ######################################################################
      # Device nodes
      ######################################################################

      - name: Create device nodes
        run: |
          sudo mkdir -p initrd-tree/dev

          sudo mknod -m 622 initrd-tree/dev/console c 5 1 || true
          sudo mknod -m 666 initrd-tree/dev/null c 1 3 || true
          sudo mknod -m 666 initrd-tree/dev/tty c 5 0 || true

      ######################################################################
      # Build initramfs
      ######################################################################

      - name: Build initramfs
        run: |
          cd initrd-tree

          sudo find . -print0 \
            | sudo cpio --null -ov --format=newc \
            | gzip -9 \
            > ../initramfs-${{ matrix.arch }}.cpio.gz

      ######################################################################
      # Upload artifacts
      ######################################################################

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-${{ matrix.arch }}
          path: |
            initramfs-${{ matrix.arch }}.cpio.gz
            ${{ matrix.kernel_deb }}

      ######################################################################
      # Publish release
      ######################################################################

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}

          files: |
            initramfs-${{ matrix.arch }}.cpio.gz
            ${{ matrix.kernel_deb }}

        env:
          GITHUB_TOKEN: ${{ github.token }}
