```yaml
name: Build Provisioning Runtime

on:
  workflow_dispatch:

env:
  DEBIAN_RELEASE: trixie
  DEBIAN_MIRROR: http://deb.debian.org/debian
  KERNEL_VERSION: 6.12.73+deb13-amd64
  KERNEL_DEB: linux-image-6.12.73+deb13-amd64_6.12.73-1_amd64.deb

  SMB_DOMAIN: jukebox.internal
  SMB_USERNAME: Administrator
  SMB_SHARE: DeployTools
  SMB_MOUNT: /mnt/deploytools

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            wget \
            curl \
            jq \
            iproute2 \
            net-tools

      - name: Create root filesystem
        run: |
          sudo debootstrap \
            --arch=amd64 \
            ${DEBIAN_RELEASE} \
            rootfs \
            ${DEBIAN_MIRROR}

      - name: Configure APT sources
        run: |
          cat <<EOF | sudo tee rootfs/etc/apt/sources.list
          deb http://deb.debian.org/debian ${DEBIAN_RELEASE} main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security ${DEBIAN_RELEASE}-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian ${DEBIAN_RELEASE}-updates main contrib non-free non-free-firmware
          EOF

      - name: Install runtime packages
        run: |
          sudo chroot rootfs apt-get update

          sudo chroot rootfs apt-get install -y \
            systemd \
            systemd-sysv \
            dbus \
            kmod \
            udev \
            iproute2 \
            iputils-ping \
            openssh-server \
            openssh-client \
            curl \
            wget \
            jq \
            python3 \
            python3-requests \
            cifs-utils \
            smbclient \
            pciutils \
            usbutils \
            lshw \
            dmidecode \
            lsblk \
            tmux \
            vim-tiny \
            less \
            procps \
            net-tools \
            dnsutils \
            locales \
            ca-certificates \
            initramfs-tools \
            linux-image-amd64

      - name: Configure locale
        run: |
          echo "en_US.UTF-8 UTF-8" | sudo tee -a rootfs/etc/locale.gen

          sudo chroot rootfs locale-gen
          sudo chroot rootfs update-locale LANG=en_US.UTF-8

      - name: Configure hostname
        run: |
          echo "provisioning-runtime" | sudo tee rootfs/etc/hostname

          cat <<EOF | sudo tee rootfs/etc/hosts
          127.0.0.1 localhost
          127.0.1.1 provisioning-runtime
          EOF

      - name: Configure SSH
        run: |
          sudo mkdir -p rootfs/etc/ssh

          sudo chroot rootfs systemctl enable ssh

          cat <<EOF | sudo tee -a rootfs/etc/ssh/sshd_config
          PermitRootLogin yes
          PasswordAuthentication yes
          UseDNS no
          EOF

          echo "root:root" | sudo chroot rootfs chpasswd

      - name: Enable networking
        run: |
          sudo chroot rootfs systemctl enable systemd-networkd
          sudo chroot rootfs systemctl enable systemd-resolved

          sudo mkdir -p rootfs/etc/systemd/network

          cat <<EOF | sudo tee rootfs/etc/systemd/network/20-wired.network
          [Match]
          Name=e*

          [Network]
          DHCP=yes
          IPv6AcceptRA=yes
          EOF

      - name: Create SMB mount helper
        run: |
          sudo mkdir -p rootfs/usr/local/bin

          cat <<'EOF' | sudo tee rootfs/usr/local/bin/mount-deploytools.sh
          #!/bin/bash

          set -euo pipefail

          DOMAIN="${SMB_DOMAIN:-jukebox.internal}"
          USERNAME="${SMB_USERNAME:-Administrator}"
          SHARE="${SMB_SHARE:-DeployTools}"
          MOUNTPOINT="${SMB_MOUNT:-/mnt/deploytools}"

          ETH0_IP="$(ip -4 addr show eth0 | awk '/inet / {print $2}' | cut -d/ -f1)"
          SUBNET_BASE="$(echo "${ETH0_IP}" | awk -F. '{print $1"."$2"."$3}')"

          SERVER="${SUBNET_BASE}.10"

          echo
          echo "=================================================="
          echo "DEPLOYTOOLS SMB MOUNT"
          echo "=================================================="
          echo
          echo "[*] eth0 IP       : ${ETH0_IP}"
          echo "[*] SMB Server    : ${SERVER}"
          echo "[*] SMB Share     : ${SHARE}"
          echo

          ping -c1 "${SERVER}" >/dev/null

          mkdir -p "${MOUNTPOINT}"

          echo
          echo "[*] Password required for ${DOMAIN}\\${USERNAME}"
          echo

          mount -t cifs "//${SERVER}/${SHARE}" "${MOUNTPOINT}" \
            -o username="${USERNAME}",domain="${DOMAIN}",vers=3.1.1,seal,rw

          echo
          echo "[*] Verifying mount..."
          echo

          mountpoint -q "${MOUNTPOINT}"

          df -h "${MOUNTPOINT}"

          mkdir -p "${MOUNTPOINT}/inventory"
          mkdir -p "${MOUNTPOINT}/logs"

          echo
          echo "[+] DeployTools mounted successfully"
          EOF

          sudo chmod +x rootfs/usr/local/bin/mount-deploytools.sh

      - name: Create hardware collector
        run: |
          cat <<'EOF' | sudo tee rootfs/usr/local/bin/hwcollect.sh
          #!/bin/bash

          set -euo pipefail

          TMPDIR="/tmp/hwcollect"
          mkdir -p "${TMPDIR}"

          ETH0_MAC="$(cat /sys/class/net/eth0/address | tr ':' '-')"

          OUT_LOCAL="/root/${ETH0_MAC}.json"
          OUT_REMOTE="/mnt/deploytools/inventory/${ETH0_MAC}.json"

          echo "[*] Collecting inventory..."

          ip -j addr > "${TMPDIR}/network.json"
          lsblk -J > "${TMPDIR}/block.json"
          lspci -mm > "${TMPDIR}/pci.txt"
          lsusb > "${TMPDIR}/usb.txt"
          dmidecode > "${TMPDIR}/dmi.txt"

          jq -n \
            --arg hostname "$(hostname)" \
            --arg kernel "$(uname -a)" \
            --arg eth0_mac "${ETH0_MAC}" \
            --slurpfile network "${TMPDIR}/network.json" \
            --slurpfile block "${TMPDIR}/block.json" \
            '{
              hostname: $hostname,
              kernel: $kernel,
              eth0_mac: $eth0_mac,
              network: $network,
              block: $block
            }' > "${OUT_LOCAL}.tmp"

          mv "${OUT_LOCAL}.tmp" "${OUT_LOCAL}"

          echo "[+] Local inventory: ${OUT_LOCAL}"

          if mountpoint -q /mnt/deploytools; then
            cp "${OUT_LOCAL}" "${OUT_REMOTE}.tmp"
            mv "${OUT_REMOTE}.tmp" "${OUT_REMOTE}"

            echo "[+] Uploaded inventory: ${OUT_REMOTE}"
          fi
          EOF

          sudo chmod +x rootfs/usr/local/bin/hwcollect.sh

      - name: Create systemd services
        run: |
          cat <<EOF | sudo tee rootfs/etc/systemd/system/hwcollect.service
          [Unit]
          Description=Hardware Inventory Collection
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/hwcollect.sh

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo chroot rootfs systemctl enable hwcollect.service

      - name: Enable root autologin
        run: |
          sudo mkdir -p rootfs/etc/systemd/system/getty@tty1.service.d

          cat <<EOF | sudo tee rootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I \$TERM
          EOF

      - name: Clean filesystem
        run: |
          sudo chroot rootfs apt-get clean

          sudo rm -rf rootfs/tmp/*
          sudo rm -rf rootfs/var/lib/apt/lists/*

      - name: Fix ownership safely
        run: |
          sudo chown -R root:root rootfs || true
          sudo chmod 755 rootfs

      - name: Build initramfs
        run: |
          sudo chroot rootfs update-initramfs -u

      - name: Build squashfs
        run: |
          sudo mksquashfs rootfs filesystem.squashfs -comp xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-runtime
          path: filesystem.squashfs
```
