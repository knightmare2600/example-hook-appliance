name: Build Provisioning Runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    env:
      DEBIAN_RELEASE: bookworm
      DEBIAN_MIRROR: http://deb.debian.org/debian

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap cpio gzip xz-utils curl wget rsync

      - name: Create working directories
        run: |
          mkdir -p rootfs
          mkdir -p initrd-tree

      - name: Build Debian rootfs
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            ${DEBIAN_RELEASE} \
            rootfs \
            ${DEBIAN_MIRROR}

      - name: Mount chroot filesystems
        run: |
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys rootfs/sys
          sudo mount --bind /dev/pts rootfs/dev/pts

      - name: Configure apt sources
        run: |
          cat << EOF | sudo tee rootfs/etc/apt/sources.list
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          EOF

      - name: Install provisioning packages
        run: |
          sudo chroot rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive

            apt-get update

            apt-get install -y \
              systemd \
              systemd-sysv \
              dbus \
              dbus-broker \
              libpam-systemd \
              udev \
              kmod \
              util-linux \
              login \
              passwd \
              bash \
              busybox-static \
              iproute2 \
              net-tools \
              isc-dhcp-client \
              ifupdown \
              iputils-ping \
              ethtool \
              curl \
              wget \
              jq \
              ca-certificates \
              openssh-server \
              openssh-client \
              ssh \
              tmux \
              vim-tiny \
              less \
              file \
              rsync \
              tar \
              gzip \
              bzip2 \
              xz-utils \
              pciutils \
              usbutils \
              dmidecode \
              lshw \
              smartmontools \
              nvme-cli \
              mdadm \
              ipmitool \
              python3 \
              python3-pip \
              kbd \
              console-setup \
              fbset \
              acpid \
              minicom \ 
              lrzsz \
              linux-firmware \
              linux-firmware-nonfree

            apt-get clean
          "

      - name: Configure networking
        run: |
          cat << EOF | sudo tee rootfs/etc/network/interfaces
          auto lo
          iface lo inet loopback

          allow-hotplug eth0
          iface eth0 inet dhcp
          EOF

      - name: Configure root account
        run: |
          echo 'root:root' | sudo chroot rootfs chpasswd

      - name: Enable SSH root login
        run: |
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' rootfs/etc/ssh/sshd_config
          sudo sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' rootfs/etc/ssh/sshd_config

      - name: Enable systemd services
        run: |
          sudo chroot rootfs systemctl enable ssh
          sudo chroot rootfs systemctl enable serial-getty@ttyS0.service
          sudo chroot rootfs systemctl enable getty@tty1.service
          sudo chroot rootfs systemctl enable systemd-networkd
          sudo chroot rootfs systemctl set-default multi-user.target

      - name: Install provisioning service
        run: |
          cat << 'EOF' | sudo tee rootfs/etc/systemd/system/provisioning.service
          [Unit]
          Description=Provisioning Runtime
          After=network-online.target ssh.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/collector/start.sh
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo chroot rootfs systemctl enable provisioning.service

      - name: Verify installed tools
        run: |
          sudo chroot rootfs /bin/bash -c "
            echo '=== TOOL CHECK ==='

            for x in \
              ip \
              dhclient \
              curl \
              wget \
              sshd \
              tmux \
              vim \
              lspci \
              dmidecode \
              nvme \
              smartctl \
              modprobe \
              lsmod \
              ethtool \
              ifconfig
            do
              echo
              echo \"=== \$x ===\"
              which \$x || true
            done

            echo
            echo '=== SYSTEMD ==='
            ls -l /lib/systemd/systemd || true
          "

      - name: Copy rootfs into initrd tree
        run: |
          sudo rsync -aHAX \
            --exclude=/proc/* \
            --exclude=/sys/* \
            --exclude=/dev/* \
            --exclude=/run/* \
            --exclude=/tmp/* \
            rootfs/ initrd-tree/

      - name: Install bootstrap init
        run: |
          cat << 'EOF' | sudo tee initrd-tree/init
          #!/bin/sh

          mount -t devtmpfs devtmpfs /dev
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t tmpfs tmpfs /run

          mkdir -p /run/lock
          mkdir -p /var/run

          exec /lib/systemd/systemd
          EOF

          sudo chmod +x initrd-tree/init

      - name: Install MOTD and shell config
        run: |
          sudo cp initramfs/motd initrd-tree/etc/motd || true
          sudo cp initramfs/bashrc initrd-tree/root/.bashrc || true

      - name: Copy collector and overlay
        run: |
          sudo mkdir -p initrd-tree/collector
          sudo mkdir -p initrd-tree/overlay

          sudo cp -r collector/* initrd-tree/collector/ || true
          sudo cp -r overlay/* initrd-tree/overlay/ || true

      - name: Create required runtime directories
        run: |
          sudo mkdir -p initrd-tree/run
          sudo mkdir -p initrd-tree/run/sshd
          sudo mkdir -p initrd-tree/var/run/sshd
          sudo mkdir -p initrd-tree/tmp
          sudo mkdir -p initrd-tree/root

      - name: Create device nodes
        run: |
          sudo mknod -m 622 initrd-tree/dev/console c 5 1 || true
          sudo mknod -m 666 initrd-tree/dev/null c 1 3 || true
          sudo mknod -m 666 initrd-tree/dev/tty c 5 0 || true
          sudo mknod -m 666 initrd-tree/dev/ttyS0 c 4 64 || true

      - name: Unmount chroot filesystems
        run: |
          sudo umount rootfs/dev/pts || true
          sudo umount rootfs/dev || true
          sudo umount rootfs/proc || true
          sudo umount rootfs/sys || true

      - name: Build final initramfs
        run: |
          cd initrd-tree
          sudo find . -print0 | sudo cpio --null -ov --format=newc | gzip -9 > ../initramfs-amd64.cpio.gz

      - name: Upload initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-amd64
          path: initramfs-amd64.cpio.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: provisioning-runtime
          files: initramfs-amd64.cpio.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
