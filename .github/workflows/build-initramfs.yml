name: Build Provisioning Runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    env:
      DEBIAN_RELEASE: trixie
      DEBIAN_MIRROR: http://deb.debian.org/debian
      KERNEL_VERSION: 6.12.73+deb13-amd64
      KERNEL_DEB: linux-image-6.12.73+deb13-amd64_6.12.73-1_amd64.deb

      SMB_DOMAIN: jukebox.internal
      SMB_USERNAME: Administrator
      SMB_SHARE: DeployTools
      SMB_MOUNT: /mnt/deploytools

    steps:

      ######################################################################
      # Checkout repository
      ######################################################################

      - name: Checkout repo
        uses: actions/checkout@v4

      ######################################################################
      # Install build dependencies
      ######################################################################

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            debootstrap \
            cpio \
            gzip \
            xz-utils \
            zstd \
            curl \
            wget \
            rsync \
            dpkg \
            linux-base \
            initramfs-tools

      ######################################################################
      # Create working directories
      ######################################################################

      - name: Create working directories
        run: |
          mkdir -p rootfs
          mkdir -p initrd-tree

      ######################################################################
      # Bootstrap Debian rootfs
      ######################################################################

      - name: Build Debian rootfs
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            ${DEBIAN_RELEASE} \
            rootfs \
            ${DEBIAN_MIRROR}

      ######################################################################
      # Mount chroot pseudo filesystems
      ######################################################################

      - name: Mount chroot filesystems
        run: |
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys rootfs/sys
          sudo mount --bind /dev/pts rootfs/dev/pts

      ######################################################################
      # Configure apt repositories
      ######################################################################

      - name: Configure apt sources
        run: |
          cat << EOF | sudo tee rootfs/etc/apt/sources.list
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
          EOF

      ######################################################################
      # Download exact kernel package
      ######################################################################

      - name: Download kernel package
        run: |
          rm -f ${KERNEL_DEB}
          rm -f ${KERNEL_DEB}.1

          wget -O ${KERNEL_DEB} \
            http://ftp.uk.debian.org/debian/pool/main/l/linux-signed-amd64/${KERNEL_DEB}

          ls -lh ${KERNEL_DEB}
          sha256sum ${KERNEL_DEB}

      ######################################################################
      # Install runtime packages
      ######################################################################

      - name: Install provisioning packages
        run: |
          sudo chroot rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive

            apt-get update

            apt-get install -y --no-install-recommends \
              linux-base \
              initramfs-tools \
              systemd \
              systemd-sysv \
              dbus \
              dbus-broker \
              libpam-systemd \
              udev \
              kmod \
              util-linux \
              mount \
              login \
              passwd \
              bash \
              iproute2 \
              iputils-ping \
              isc-dhcp-client \
              ethtool \
              net-tools \
              curl \
              wget \
              jq \
              ca-certificates \
              openssh-server \
              openssh-client \
              tmux \
              vim-tiny \
              less \
              procps \
              dnsutils \
              telnet \
              nmap \
              grc \
              tar \
              gzip \
              bzip2 \
              xz-utils \
              pciutils \
              usbutils \
              dmidecode \
              lshw \
              smartmontools \
              nvme-cli \
              mdadm \
              ipmitool \
              python3 \
              python3-requests \
              cifs-utils \
              smbclient \
              kbd \
              console-setup \
              keyboard-configuration \
              console-data \
              acpid \
              minicom \
              lrzsz \
              ckermit \
              systemd-resolved \
              locales \
              firmware-linux-free \
              firmware-realtek \
              firmware-misc-nonfree

            apt-get clean
          "

      ######################################################################
      # Configure locale
      ######################################################################

      - name: Configure locale
        run: |
          sudo chroot rootfs /bin/bash -c "
            echo 'en_US.UTF-8 UTF-8' > /etc/locale.gen
            locale-gen
            update-locale LANG=en_US.UTF-8
          "

      ######################################################################
      # Install kernel
      ######################################################################

      - name: Install kernel package
        run: |
          sudo cp ${KERNEL_DEB} rootfs/root/

          sudo chroot rootfs /bin/bash -c "
            dpkg -i /root/${KERNEL_DEB}
          "

      ######################################################################
      # Generate module database
      ######################################################################

      - name: Generate module dependency database
        run: |
          sudo chroot rootfs /bin/bash -c "
            depmod -a ${KERNEL_VERSION}
          "

      ######################################################################
      # Configure keyboard
      ######################################################################

      - name: Configure keyboard
        run: |
          cat << EOF | sudo tee rootfs/etc/default/keyboard
          XKBMODEL=\"pc105\"
          XKBLAYOUT=\"gb\"
          XKBVARIANT=\"\"
          XKBOPTIONS=\"\"
          BACKSPACE=\"guess\"
          EOF

      ######################################################################
      # Configure networking
      ######################################################################

      - name: Configure networking
        run: |
          sudo mkdir -p rootfs/etc/systemd/network

          cat << EOF | sudo tee rootfs/etc/systemd/network/20-wired.network
          [Match]
          Name=eth*

          [Network]
          DHCP=yes
          EOF

          sudo ln -sf \
            /run/systemd/resolve/stub-resolv.conf \
            rootfs/etc/resolv.conf

      ######################################################################
      # Configure root account
      ######################################################################

      - name: Configure root account
        run: |
          echo 'root:root' | sudo chroot rootfs chpasswd

      ######################################################################
      # Enable SSH root login
      ######################################################################

      - name: Configure SSH
        run: |
          sudo sed -i \
            's/^#PermitRootLogin.*/PermitRootLogin yes/' \
            rootfs/etc/ssh/sshd_config

          sudo sed -i \
            's/^#PasswordAuthentication.*/PasswordAuthentication yes/' \
            rootfs/etc/ssh/sshd_config

      ######################################################################
      # Configure autologin
      ######################################################################

      - name: Configure automatic root login
        run: |
          sudo mkdir -p \
            rootfs/etc/systemd/system/getty@tty1.service.d

          cat << EOF | sudo tee \
            rootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I \$TERM
          EOF

      ######################################################################
      # Install hardware collector
      ######################################################################

      - name: Install hardware inventory collector
        run: |
          cat << 'EOF' | sudo tee rootfs/usr/local/bin/hwcollect.sh
          #!/bin/bash

          set -euo pipefail

          OUTDIR="/root/inventory"
          TMPDIR="/tmp/hwcollect"

          mkdir -p "${OUTDIR}"
          mkdir -p "${TMPDIR}"

          #
          # Determine primary MAC from eth0
          #

          MAC="$(cat /sys/class/net/eth0/address | tr ':' '-')"

          JSON_OUT="${OUTDIR}/${MAC}.json"
          LOG_OUT="${OUTDIR}/${MAC}.log"

          exec > >(tee -a "${LOG_OUT}") 2>&1

          echo "[*] Starting hardware collection"

          echo "[*] Collecting network data..."
          ip -j addr > "${TMPDIR}/network.json"

          echo "[*] Collecting block device data..."
          lsblk -J > "${TMPDIR}/blockdevices.json"

          echo "[*] Collecting PCI inventory..."
          lspci -mm > "${TMPDIR}/lspci.txt" || true

          echo "[*] Collecting USB inventory..."
          lsusb > "${TMPDIR}/lsusb.txt" || true

          echo "[*] Collecting DMI inventory..."
          dmidecode > "${TMPDIR}/dmidecode.txt" || true

          echo "[*] Building JSON output..."

          jq -n \
            --arg hostname "$(hostname)" \
            --arg kernel "$(uname -a)" \
            --arg mac "${MAC}" \
            --slurpfile network "${TMPDIR}/network.json" \
            --slurpfile blockdevices "${TMPDIR}/blockdevices.json" \
            --rawfile lspci "${TMPDIR}/lspci.txt" \
            --rawfile lsusb "${TMPDIR}/lsusb.txt" \
            --rawfile dmidecode "${TMPDIR}/dmidecode.txt" \
            '{
              hostname: $hostname,
              kernel: $kernel,
              primary_mac: $mac,
              network: $network[0],
              blockdevices: $blockdevices[0],
              lspci: $lspci,
              lsusb: $lsusb,
              dmidecode: $dmidecode
            }' > "${JSON_OUT}"

          chmod 600 "${JSON_OUT}"
          chmod 600 "${LOG_OUT}"

          echo "[+] Hardware inventory written to ${JSON_OUT}"

          #
          # Detect deployment server
          #

          ETH0_IP="$(ip -4 addr show eth0 \
            | awk '/inet / {print $2}' \
            | cut -d/ -f1 \
            | head -n1)"

          SUBNET="$(echo "${ETH0_IP}" | awk -F. '{print $1"."$2"."$3}')"

          DEPLOY_HOST="${SUBNET}.10"

          echo "[*] Deployment server: ${DEPLOY_HOST}"

          mkdir -p "__SMB_MOUNT__"

          #
          # Probe SMB
          #

          if ping -c1 -W1 "${DEPLOY_HOST}" >/dev/null 2>&1; then

            echo "[+] Deployment host reachable"

            if smbclient -L "//${DEPLOY_HOST}" -N 2>/dev/null \
              | grep -q "__SMB_SHARE__"; then

              echo "[+] DeployTools share detected"

              echo
              echo "=================================================="
              echo "SMB AUTHENTICATION REQUIRED"
              echo "=================================================="

              read -p "Domain username [__SMB_DOMAIN__\\__SMB_USERNAME__]: " USERNAME

              if [ -z "${USERNAME}" ]; then
                USERNAME="__SMB_DOMAIN__\\__SMB_USERNAME__"
              fi

              read -s -p "Password: " PASSWORD
              echo

              cat > /tmp/creds.$$ << CREDS
          username=${USERNAME}
          password=${PASSWORD}
          domain=__SMB_DOMAIN__
          CREDS

              chmod 600 /tmp/creds.$$

              if mount -t cifs \
                "//${DEPLOY_HOST}/__SMB_SHARE__" \
                "__SMB_MOUNT__" \
                -o "credentials=/tmp/creds.$$,vers=3.0,iocharset=utf8"; then

                echo "[+] SMB mount successful"

                if mount | grep -q "__SMB_MOUNT__"; then

                  echo "[+] SMB mount verified"

                  mkdir -p "__SMB_MOUNT__/inventory"
                  mkdir -p "__SMB_MOUNT__/logs"

                  cp -f "${JSON_OUT}" "__SMB_MOUNT__/inventory/"
                  cp -f "${LOG_OUT}" "__SMB_MOUNT__/logs/"

                  sync

                  echo "[+] Files copied to DeployTools share"
                fi
              else
                echo "[-] SMB mount failed"
              fi

              shred -u /tmp/creds.$$ || rm -f /tmp/creds.$$
            else
              echo "[-] DeployTools share not found"
            fi
          else
            echo "[-] Deployment server unreachable"
          fi

          echo "[+] Hardware collection completed"
          EOF

          sudo sed -i \
            "s|__SMB_DOMAIN__|${SMB_DOMAIN}|g" \
            rootfs/usr/local/bin/hwcollect.sh

          sudo sed -i \
            "s|__SMB_USERNAME__|${SMB_USERNAME}|g" \
            rootfs/usr/local/bin/hwcollect.sh

          sudo sed -i \
            "s|__SMB_SHARE__|${SMB_SHARE}|g" \
            rootfs/usr/local/bin/hwcollect.sh

          sudo sed -i \
            "s|__SMB_MOUNT__|${SMB_MOUNT}|g" \
            rootfs/usr/local/bin/hwcollect.sh

          sudo chmod +x rootfs/usr/local/bin/hwcollect.sh

      ######################################################################
      # Hardware inventory service
      ######################################################################

      - name: Install hardware inventory service
        run: |
          cat << EOF | sudo tee rootfs/etc/systemd/system/hwcollect.service
          [Unit]
          Description=Hardware Inventory Collection
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          StandardInput=tty
          StandardOutput=journal+console
          ExecStart=/usr/local/bin/hwcollect.sh

          [Install]
          WantedBy=multi-user.target
          EOF

      ######################################################################
      # Provisioning service
      ######################################################################

      - name: Install provisioning service
        run: |
          cat << 'EOF' | sudo tee rootfs/etc/systemd/system/provisioning.service
          [Unit]
          Description=Provisioning Runtime
          After=network-online.target ssh.service
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/collector

          #
          # IMPORTANT:
          # Bind to all interfaces, NOT a hardcoded IP.
          #

          Environment=PYTHONUNBUFFERED=1

          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0

          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

      ######################################################################
      # Enable services
      ######################################################################

      - name: Enable services
        run: |
          sudo chroot rootfs systemctl enable ssh
          sudo chroot rootfs systemctl enable systemd-networkd
          sudo chroot rootfs systemctl enable systemd-resolved
          sudo chroot rootfs systemctl enable getty@tty1.service
          sudo chroot rootfs systemctl enable hwcollect.service
          sudo chroot rootfs systemctl enable provisioning.service
          sudo chroot rootfs systemctl set-default multi-user.target

      ######################################################################
      # Cleanup
      ######################################################################

      - name: Cleanup image
        run: |
          sudo chroot rootfs /bin/bash -c "
            apt-get autoremove -y
            apt-get clean

            rm -rf /var/lib/apt/lists/*
            rm -rf /usr/share/doc/*
            rm -rf /usr/share/man/*
            rm -rf /usr/share/info/*
            rm -rf /tmp/*
          "

      ######################################################################
      # Normalize ownership
      ######################################################################

      - name: Normalize ownership
        run: |
          sudo chown root:root rootfs
          sudo chmod 755 rootfs

      ######################################################################
      # Verify binaries
      ######################################################################

      - name: Verify installed tools
        run: |
          sudo chroot rootfs /bin/bash -c "
            echo '=== TOOL CHECK ==='

            for x in \
              ip \
              curl \
              wget \
              sshd \
              tmux \
              vim \
              vim.tiny \
              lspci \
              dmidecode \
              nvme \
              smartctl \
              modprobe \
              lsmod \
              ethtool \
              minicom \
              sz \
              rz \
              kermit \
              smbclient \
              mount.cifs \
              nmap \
              grc
            do
              echo
              echo \"=== \$x ===\"
              command -v \$x || true
            done
          "

      ######################################################################
      # Unmount chroot filesystems
      ######################################################################

      - name: Unmount chroot filesystems
        run: |
          sudo umount rootfs/dev/pts || true
          sudo umount rootfs/dev || true
          sudo umount rootfs/proc || true
          sudo umount rootfs/sys || true

      ######################################################################
      # Copy rootfs
      ######################################################################

      - name: Copy rootfs into initrd tree
        run: |
          sudo rsync -aHAX \
            --numeric-ids \
            --exclude=/proc/* \
            --exclude=/sys/* \
            --exclude=/dev/* \
            --exclude=/run/* \
            --exclude=/tmp/* \
            rootfs/ initrd-tree/

      ######################################################################
      # Install bootstrap init
      ######################################################################

      - name: Install bootstrap init
        run: |
          cat << 'EOF' | sudo tee initrd-tree/init
          #!/bin/sh

          mount -t devtmpfs devtmpfs /dev
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t tmpfs tmpfs /run
          mount -t tmpfs tmpfs /tmp

          mkdir -p /run/lock
          mkdir -p /var/run
          mkdir -p /dev/pts

          mount -t devpts devpts /dev/pts

          exec /lib/systemd/systemd
          EOF

          sudo chmod +x initrd-tree/init

      ######################################################################
      # Copy collector and overlay
      ######################################################################

      - name: Copy collector and overlay
        run: |
          sudo mkdir -p initrd-tree/collector
          sudo mkdir -p initrd-tree/overlay

          sudo cp -r collector/* initrd-tree/collector/ || true
          sudo cp -r overlay/* initrd-tree/overlay/ || true

      ######################################################################
      # Runtime directories
      ######################################################################

      - name: Create runtime directories
        run: |
          sudo mkdir -p initrd-tree/run
          sudo mkdir -p initrd-tree/run/sshd
          sudo mkdir -p initrd-tree/var/run/sshd
          sudo mkdir -p initrd-tree/tmp
          sudo mkdir -p initrd-tree/root

      ######################################################################
      # Device nodes
      ######################################################################

      - name: Create device nodes
        run: |
          sudo mkdir -p initrd-tree/dev

          sudo mknod -m 622 initrd-tree/dev/console c 5 1 || true
          sudo mknod -m 666 initrd-tree/dev/null c 1 3 || true
          sudo mknod -m 666 initrd-tree/dev/tty c 5 0 || true

      ######################################################################
      # Build initramfs
      ######################################################################

      - name: Build final initramfs
        run: |
          cd initrd-tree

          sudo find . -print0 \
            | sudo cpio --null -ov --format=newc \
            | gzip -9 \
            > ../initramfs-amd64.cpio.gz

      ######################################################################
      # Upload artifact
      ######################################################################

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-amd64
          path: initramfs-amd64.cpio.gz

      ######################################################################
      # Publish release
      ######################################################################

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: provisioning-runtime
          files: initramfs-amd64.cpio.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
