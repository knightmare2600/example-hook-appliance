name: Build Provisioning Runtime

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Kernel Build (Precompiled)"]
    types:
      - completed

env:
  KERNEL_VERSION: 5.10.255

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download kernel bundle
        run: |
          curl -L -o kernel-amd64.tar.gz \
            https://github.com/knightmare2600/example-hook-appliance/releases/download/kernel-${KERNEL_VERSION}/kernel-amd64.tar.gz

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            debootstrap \
            cpio \
            gzip \
            xz-utils

      - name: Create staging directory
        run: |
          mkdir -p stage/amd64

      - name: Build minimal Ubuntu rootfs
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            --include=iproute2,isc-dhcp-client,python3,procps,bash,coreutils,util-linux \
            jammy \
            stage/amd64

      - name: Extract kernel modules into rootfs
        run: |
          mkdir -p kernel-extract

          sudo tar -xzf kernel-amd64.tar.gz -C kernel-extract

          echo
          echo "=== KERNEL PACKAGE CONTENTS ==="
          find kernel-extract | head -50

          # Copy ONLY kernel modules
          if [ -d kernel-extract/lib/modules ]; then
            sudo mkdir -p stage/amd64/lib
            sudo cp -a kernel-extract/lib/modules stage/amd64/lib/
          fi

      - name: Mount pseudo filesystems
        run: |
          sudo mount --bind /dev stage/amd64/dev
          sudo mount --bind /proc stage/amd64/proc
          sudo mount --bind /sys stage/amd64/sys

          set -e
          echo "=== STAGE 1 ==="
          sudo apt-get install -y curl wget jq tmux vim-tiny grc

          echo "=== STAGE 2 ==="
          sudo apt-get install -y pciutils usbutils dmidecode lshw ethtool

          echo "=== STAGE 3 ==="
          sudo apt-get install -y ipmitool smartmontools nvme-cli mdadm

          echo "=== STAGE 4 ==="
          sudo apt-get install -y openssh-server

          echo "=== STAGE 5 ==="
          sudo apt-get install -y kbd console-setup fbset

          echo "=== STAGE 6 ==="
          sudo apt-get install -y acpid

      - name: Verify installed binaries
        run: |
          sudo chroot stage/amd64 /bin/bash -c "
            echo '=== VERIFY CORE TOOLS ==='

            which ip || true
            which ifconfig || true
            which dhclient || true
            which sshd || true
            which nvme || true
            which tmux || true
            which modprobe || true

            echo
            echo '=== VERIFY MODULE TREE ==='

            ls -l /lib/modules || true

            echo
            echo '=== FILE CHECK ==='

            ls -l /usr/sbin/sshd || true
            ls -l /usr/sbin/dhclient || true
          "

      - name: Unmount pseudo filesystems
        run: |
          sudo umount stage/amd64/dev || true
          sudo umount stage/amd64/proc || true
          sudo umount stage/amd64/sys || true

      - name: Create device nodes
        run: |
          sudo mknod -m 622 stage/amd64/dev/console c 5 1 || true
          sudo mknod -m 666 stage/amd64/dev/null c 1 3 || true

      - name: Install init script
        run: |
          sudo cp initramfs/init stage/amd64/init
          sudo chmod +x stage/amd64/init

      - name: Install supporting files
        run: |
          sudo cp initramfs/motd stage/amd64/etc/motd || true
          sudo cp initramfs/bashrc stage/amd64/root/.bashrc || true

      - name: Copy collector + overlay
        run: |
          sudo mkdir -p stage/amd64/collector
          sudo mkdir -p stage/amd64/overlay

          sudo cp -r collector/* stage/amd64/collector/ || true
          sudo cp -r overlay/* stage/amd64/overlay/ || true

      - name: Enable SSH runtime directory
        run: |
          sudo mkdir -p stage/amd64/var/run/sshd

      - name: Build initramfs archive
        run: |
          cd stage/amd64

          sudo find . -print0 | \
            sudo cpio --null -ov --format=newc | \
            gzip -9 > ../../initramfs-amd64.cpio.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-amd64
          path: initramfs-amd64.cpio.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ env.KERNEL_VERSION }}
          files: initramfs-amd64.cpio.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
