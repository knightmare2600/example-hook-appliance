name: Build Provisioning Runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    env:
      DEBIAN_RELEASE: trixie
      DEBIAN_MIRROR: http://deb.debian.org/debian

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap cpio gzip xz-utils curl wget rsync

      - name: Create root filesystem
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            --include=systemd,systemd-sysv,udev,kmod \
            ${DEBIAN_RELEASE} \
            rootfs \
            ${DEBIAN_MIRROR}

      - name: Mount chroot filesystems
        run: |
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys rootfs/sys

      - name: Install runtime packages
        run: |
          sudo chroot rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive

            apt-get update

            apt-get install -y \
              bash \
              busybox-static \
              systemd \
              systemd-sysv \
              udev \
              dbus \
              kmod \
              util-linux \
              procps \
              coreutils \
              less \
              file \
              tar \
              gzip \
              bzip2 \
              xz-utils \
              rsync \
              iproute2 \
              net-tools \
              isc-dhcp-client \
              ifupdown \
              iputils-ping \
              ethtool \
              curl \
              wget \
              jq \
              ca-certificates \
              openssh-server \
              openssh-client \
              ssh \
              tmux \
              vim-tiny \
              pciutils \
              usbutils \
              dmidecode \
              lshw \
              mdadm \
              smartmontools \
              nvme-cli \
              python3 \
              python3-pip \
              kbd \
              console-setup \
              fbset \
              acpid \
              login \
              passwd \
              sudo \
              tzdata \
              locales

            systemctl enable ssh
            systemctl enable systemd-networkd
            systemctl enable systemd-resolved
            systemctl enable serial-getty@ttyS0.service

            apt-get clean
          "

      - name: Configure networking
        run: |
          sudo mkdir -p rootfs/etc/systemd/network

          cat << 'EOF' | sudo tee rootfs/etc/systemd/network/20-wired.network
          [Match]
          Name=en* eth*

          [Network]
          DHCP=yes
          EOF

      - name: Configure root account
        run: |
          echo 'root:root' | sudo chroot rootfs chpasswd

      - name: Configure SSH
        run: |
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' rootfs/etc/ssh/sshd_config
          sudo sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' rootfs/etc/ssh/sshd_config

      - name: Install provisioning service
        run: |
          sudo mkdir -p rootfs/etc/systemd/system

          cat << 'EOF' | sudo tee rootfs/etc/systemd/system/provisioning.service
          [Unit]
          Description=Provisioning Runtime Task
          After=network-online.target ssh.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/provisioning-task.sh
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo mkdir -p rootfs/usr/local/bin

          cat << 'EOF' | sudo tee rootfs/usr/local/bin/provisioning-task.sh
          #!/bin/bash

          echo "Provisioning runtime started"
          ip addr
          EOF

          sudo chmod +x rootfs/usr/local/bin/provisioning-task.sh

          sudo chroot rootfs systemctl enable provisioning.service

      - name: Install MOTD and shell config
        run: |
          sudo cp initramfs/motd rootfs/etc/motd || true
          sudo cp initramfs/bashrc rootfs/root/.bashrc || true

      - name: Copy collector and overlay
        run: |
          sudo mkdir -p rootfs/collector
          sudo mkdir -p rootfs/overlay

          sudo cp -r collector/* rootfs/collector/ || true
          sudo cp -r overlay/* rootfs/overlay/ || true

      - name: Create runtime directories
        run: |
          sudo mkdir -p rootfs/run
          sudo mkdir -p rootfs/run/sshd
          sudo mkdir -p rootfs/var/run
          sudo mkdir -p rootfs/var/run/sshd
          sudo mkdir -p rootfs/root
          sudo mkdir -p rootfs/tmp

      - name: Create device nodes
        run: |
          sudo mknod -m 622 rootfs/dev/console c 5 1 || true
          sudo mknod -m 666 rootfs/dev/null c 1 3 || true
          sudo mknod -m 666 rootfs/dev/tty c 5 0 || true
          sudo mknod -m 666 rootfs/dev/ttyS0 c 4 64 || true

      - name: Verify installed tools
        run: |
          sudo chroot rootfs /bin/bash -c "
            echo '=== TOOL CHECK ==='

            for x in \
              ip \
              dhclient \
              curl \
              wget \
              sshd \
              tmux \
              vim \
              lspci \
              dmidecode \
              nvme \
              smartctl \
              modprobe \
              lsmod \
              ethtool \
              ifconfig \
              login \
              systemctl
            do
              echo
              echo \"=== \$x ===\"
              which \$x || true
            done

            echo
            echo '=== SYSTEMD DEFAULT TARGET ==='
            systemctl get-default || true
          "

      - name: Unmount chroot filesystems
        run: |
          sudo umount rootfs/dev || true
          sudo umount rootfs/proc || true
          sudo umount rootfs/sys || true

      - name: Build initramfs
        run: |
          cd rootfs

          sudo find . -print0 | sudo cpio --null -ov --format=newc | gzip -9 > ../initramfs-amd64.cpio.gz

      - name: Upload initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-amd64
          path: initramfs-amd64.cpio.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: provisioning-runtime
          files: initramfs-amd64.cpio.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
