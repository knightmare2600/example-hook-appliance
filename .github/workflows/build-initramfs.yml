name: Build Provisioning Runtime

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Kernel Build (Precompiled)"]
    types:
      - completed

env:
  KERNEL_VERSION: 5.10.255

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            cpio \
            gzip \
            xz-utils

      - name: Create staging directory
        run: |
          mkdir -p stage/amd64

      - name: Build minimal Ubuntu rootfs
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase --include=iproute2,isc-dhcp-client,python3,procps,bash,coreutils,util-linux \
            jammy \
            stage/amd64

      - name: Mount pseudo filesystems (CRITICAL)
        run: |
          sudo mount --bind /dev stage/amd64/dev
          sudo mount --bind /proc stage/amd64/proc
          sudo mount --bind /sys stage/amd64/sys

      - name: Install provisioning packages
        run: |
          sudo chroot stage/amd64 /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive

            apt-get update

            apt-get install -y \
              bash \
              busybox-static \
              iproute2 \
              net-tools \
              isc-dhcp-client \
              iputils-ping \
              curl \
              wget \
              ca-certificates \
              openssh-server \
              tmux \
              vim-tiny \
              grc \
              pciutils \
              usbutils \
              dmidecode \
              lshw \
              ipmitool \
              mdadm \
              smartmontools \
              nvme-cli \
              jq \
              python3 \
              python3-pip \
              kbd \
              console-setup \
              fbset util-linux login

            apt-get clean
          "

      - name: Verify installed binaries (IMPORTANT DEBUG STEP)
        run: |
          sudo chroot stage/amd64 /bin/bash -c "
            echo '=== VERIFY CORE TOOLS ==='
            which ip || true
            which ifconfig || true
            which dhclient || true
            which sshd || true
            which nvme || true
            which tmux || true

            echo
            echo '=== FILE CHECK ==='
            ls -l /usr/sbin/sshd || true
            ls -l /usr/sbin/dhclient || true
          "

      - name: Unmount pseudo filesystems
        run: |
          sudo umount stage/amd64/dev || true
          sudo umount stage/amd64/proc || true
          sudo umount stage/amd64/sys || true

      - name: Create device nodes
        run: |
          sudo mknod -m 622 stage/amd64/dev/console c 5 1 || true
          sudo mknod -m 666 stage/amd64/dev/null c 1 3 || true

      - name: Install init script
        run: |
          sudo cp initramfs/init stage/amd64/init
          sudo chmod +x stage/amd64/init

      - name: Install supporting files
        run: |
          sudo cp initramfs/motd stage/amd64/etc/motd || true
          sudo cp initramfs/bashrc stage/amd64/root/.bashrc || true

      - name: Copy collector + overlay
        run: |
          sudo mkdir -p stage/amd64/collector
          sudo mkdir -p stage/amd64/overlay

          sudo cp -r collector/* stage/amd64/collector/ || true
          sudo cp -r overlay/* stage/amd64/overlay/ || true

      - name: Enable SSH runtime directory
        run: |
          sudo mkdir -p stage/amd64/var/run/sshd

      - name: Enable SSH host keys (build-time safe)
        run: |
          sudo chroot stage/amd64 ssh-keygen -A || true

      - name: Build initramfs archive
        run: |
          cd stage/amd64
          sudo find . -print0 | \
            sudo cpio --null -ov --format=newc | \
            gzip -9 > ../../initramfs-amd64.cpio.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-amd64
          path: initramfs-amd64.cpio.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ env.KERNEL_VERSION }}
          files: initramfs-amd64.cpio.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
