name: Build Provisioning Runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    env:
      DEBIAN_RELEASE: trixie
      DEBIAN_MIRROR: http://deb.debian.org/debian
      KERNEL_VERSION: 6.12.73+deb13-amd64
      KERNEL_DEB: linux-image-6.12.73+deb13-amd64_6.12.73-1_amd64.deb

    steps:
      ######################################################################
      # Checkout
      ######################################################################

      - name: Checkout repo
        uses: actions/checkout@v4

      ######################################################################
      # Build dependencies
      ######################################################################

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            debootstrap \
            cpio \
            gzip \
            xz-utils \
            curl \
            wget \
            rsync \
            dpkg \
            linux-base \
            initramfs-tools

      ######################################################################
      # Working directories
      ######################################################################

      - name: Create working directories
        run: |
          mkdir -p rootfs
          mkdir -p initrd-tree

      ######################################################################
      # Bootstrap Debian
      ######################################################################

      - name: Build Debian rootfs
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            ${DEBIAN_RELEASE} \
            rootfs \
            ${DEBIAN_MIRROR}

      ######################################################################
      # Mount pseudo filesystems for chroot
      ######################################################################

      - name: Mount chroot filesystems
        run: |
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys rootfs/sys
          sudo mount --bind /dev/pts rootfs/dev/pts

      ######################################################################
      # Configure apt
      ######################################################################

      - name: Configure apt sources
        run: |
          cat << EOF | sudo tee rootfs/etc/apt/sources.list
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
          EOF

      ######################################################################
      # Download exact kernel package
      ######################################################################

      - name: Download exact matching kernel package
        run: |
          rm -f ${KERNEL_DEB}
          rm -f ${KERNEL_DEB}.1

          wget -O ${KERNEL_DEB} \
            http://ftp.uk.debian.org/debian/pool/main/l/linux-signed-amd64/${KERNEL_DEB}

          ls -lh ${KERNEL_DEB}
          file ${KERNEL_DEB}
          sha256sum ${KERNEL_DEB}
          dpkg-deb --info ${KERNEL_DEB}

      ######################################################################
      # Install runtime packages
      ######################################################################

      - name: Install provisioning packages
        run: |
          sudo chroot rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive

            apt-get update

            apt-get install -y --no-install-recommends \
              linux-base \
              initramfs-tools \
              systemd \
              systemd-sysv \
              dbus \
              dbus-broker \
              libpam-systemd \
              udev \
              kmod \
              util-linux \
              login \
              passwd \
              bash \
              iproute2 \
              iputils-ping \
              ethtool \
              curl \
              wget \
              jq \
              ca-certificates \
              openssh-server \
              openssh-client \
              tmux \
              vim-tiny \
              less \
              tar \
              gzip \
              bzip2 \
              xz-utils \
              pciutils \
              usbutils \
              dmidecode \
              lshw \
              smartmontools \
              nvme-cli \
              mdadm \
              ipmitool \
              python3 \
              kbd \
              console-setup \
              keyboard-configuration \
              console-data \
              acpid \
              minicom \
              lrzsz \
              ckermit \
              systemd-resolved \
              firmware-linux-free \
              firmware-realtek \
              firmware-misc-nonfree \
              wireless-regdb \
              isc-dhcp-client \
              net-tools \
              telnet \
              nmap \
              grc

            apt-get clean
          "

      ######################################################################
      # Install kernel
      ######################################################################

      - name: Install exact matching kernel package
        run: |
          sudo cp ${KERNEL_DEB} rootfs/root/

          sudo chroot rootfs /bin/bash -c "
            dpkg -i /root/${KERNEL_DEB}
          "

      ######################################################################
      # Generate module dependency database
      ######################################################################

      - name: Generate module dependency database
        run: |
          sudo chroot rootfs /bin/bash -c "
            depmod -a ${KERNEL_VERSION}

            echo
            echo '=== INSTALLED MODULE TREES ==='
            ls -l /lib/modules

            echo
            echo '=== NETWORK MODULES ==='
            find /lib/modules/${KERNEL_VERSION} -type f \
              | grep -E 'e1000|e1000e|vmxnet3|virtio_net|r8169|tg3' \
              || true
          "

      ######################################################################
      # Verify firmware
      ######################################################################

      - name: Verify firmware and modules
        run: |
          sudo chroot rootfs /bin/bash -c "
            echo
            echo '=== FIRMWARE CHECK ==='

            ls -l /lib/firmware || true

            echo
            echo '=== MODULE FILE CHECK ==='

            find /lib/modules/${KERNEL_VERSION} -type f \
              | grep -E 'e1000|e1000e|vmxnet3|virtio_net|r8169|tg3' \
              || true
          "

      ######################################################################
      # Keyboard configuration
      ######################################################################

      - name: Configure keyboard
        run: |
          cat << EOF | sudo tee rootfs/etc/default/keyboard
          XKBMODEL="pc105"
          XKBLAYOUT="gb"
          XKBVARIANT=""
          XKBOPTIONS=""
          BACKSPACE="guess"
          EOF

          sudo chroot rootfs /usr/bin/setupcon --force || true

      ######################################################################
      # Networking
      ######################################################################

      - name: Configure networking
        run: |
          sudo mkdir -p rootfs/etc/systemd/network

          cat << EOF | sudo tee rootfs/etc/systemd/network/20-wired.network
          [Match]
          Name=eth*

          [Network]
          DHCP=yes
          IPv6AcceptRA=yes
          EOF

          sudo ln -sf \
            /run/systemd/resolve/stub-resolv.conf \
            rootfs/etc/resolv.conf

      ######################################################################
      # Root account
      ######################################################################

      - name: Configure root account
        run: |
          echo 'root:root' | sudo chroot rootfs chpasswd

      ######################################################################
      # SSH configuration
      ######################################################################

      - name: Enable SSH root login
        run: |
          sudo sed -i \
            's/^#PermitRootLogin.*/PermitRootLogin yes/' \
            rootfs/etc/ssh/sshd_config

          sudo sed -i \
            's/^#PasswordAuthentication.*/PasswordAuthentication yes/' \
            rootfs/etc/ssh/sshd_config

      ######################################################################
      # Console autologin
      ######################################################################

      - name: Configure automatic root login
        run: |
          sudo mkdir -p \
            rootfs/etc/systemd/system/getty@tty1.service.d

          sudo mkdir -p \
            rootfs/etc/systemd/system/serial-getty@ttyS0.service.d

          cat << EOF | sudo tee \
            rootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I \$TERM
          EOF

          cat << EOF | sudo tee \
            rootfs/etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --keep-baud 115200,38400,9600 %I \$TERM
          EOF

      ######################################################################
      # Hardware inventory collector
      ######################################################################

      - name: Install hardware inventory collector
        run: |
          cat << 'EOF' | sudo tee rootfs/usr/local/bin/hwcollect.sh
          #!/bin/bash

          #
          # Hardware inventory collector
          #
          # Collects:
          # - hostname
          # - kernel version
          # - network interfaces
          # - block devices
          # - PCI devices
          # - USB devices
          # - DMI data
          #
          # Output:
          #   /root/hardware.json
          #

          set -e

          OUT="/root/hardware.json"

          # Store large outputs in temporary files.
          # This avoids shell argument expansion failures.
          TMPDIR="$(mktemp -d)"

          ip -j addr > "${TMPDIR}/network.json"
          lsblk -J > "${TMPDIR}/blockdevices.json"
          lspci -mm > "${TMPDIR}/lspci.txt"
          lsusb > "${TMPDIR}/lsusb.txt" || true
          dmidecode > "${TMPDIR}/dmidecode.txt" 2>/dev/null || true

          jq -n \
            --arg hostname "$(hostname)" \
            --arg kernel "$(uname -a)" \
            --slurpfile network "${TMPDIR}/network.json" \
            --slurpfile blockdevices "${TMPDIR}/blockdevices.json" \
            --rawfile lspci "${TMPDIR}/lspci.txt" \
            --rawfile lsusb "${TMPDIR}/lsusb.txt" \
            --rawfile dmidecode "${TMPDIR}/dmidecode.txt" \
            '{
              hostname: $hostname,
              kernel: $kernel,
              network: $network[0],
              blockdevices: $blockdevices[0],
              lspci: $lspci,
              lsusb: $lsusb,
              dmidecode: $dmidecode
            }' > "${OUT}"

          rm -rf "${TMPDIR}"
          EOF

          sudo chmod +x rootfs/usr/local/bin/hwcollect.sh

      ######################################################################
      # Hardware inventory service
      ######################################################################

      - name: Install hardware inventory service
        run: |
          cat << EOF | sudo tee rootfs/etc/systemd/system/hwcollect.service
          [Unit]
          Description=Hardware Inventory Collection
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/hwcollect.sh

          [Install]
          WantedBy=multi-user.target
          EOF

      ######################################################################
      # Provisioning runtime service
      ######################################################################

      - name: Install provisioning service
        run: |
          cat << 'EOF' | sudo tee rootfs/etc/systemd/system/provisioning.service
          [Unit]
          Description=Provisioning Runtime
          After=network-online.target ssh.service
          Wants=network-online.target

          [Service]
          Type=simple

          # Collector runtime entrypoint
          ExecStart=/usr/bin/python3 /collector/collector.py

          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

      ######################################################################
      # Enable services
      ######################################################################

      - name: Enable systemd services
        run: |
          sudo chroot rootfs systemctl enable ssh
          sudo chroot rootfs systemctl enable systemd-networkd
          sudo chroot rootfs systemctl enable systemd-resolved
          sudo chroot rootfs systemctl enable serial-getty@ttyS0.service
          sudo chroot rootfs systemctl enable getty@tty1.service
          sudo chroot rootfs systemctl enable hwcollect.service
          sudo chroot rootfs systemctl enable provisioning.service
          sudo chroot rootfs systemctl set-default multi-user.target

      ######################################################################
      # Remove unnecessary packages/files
      ######################################################################

      - name: Remove build junk and shrink image
        run: |
          sudo chroot rootfs /bin/bash -c "
            apt-get purge -y \
              gcc \
              gcc-14 \
              cpp \
              cpp-14 \
              exim4-base \
              exim4-config \
              exim4-daemon-light \
              make \
              fakeroot \
              manpages-dev \
              bsd-mailx || true

            apt-get autoremove -y
            apt-get clean

            rm -rf /var/lib/apt/lists/*
            rm -rf /usr/share/doc/*
            rm -rf /usr/share/man/*
            rm -rf /usr/share/info/*
            rm -rf /tmp/*
          "

      ######################################################################
      # Verify installed tools
      ######################################################################

      - name: Verify installed tools
        run: |
          sudo chroot rootfs /bin/bash -c "
            echo '=== KERNEL ==='
            ls -l /lib/modules
            echo

            echo '=== NETWORK MODULES ==='
            find /lib/modules/${KERNEL_VERSION} -type f \
              | grep -E 'e1000|e1000e|vmxnet3|virtio_net|r8169|tg3' \
              || true
            echo

            echo '=== TOOL CHECK ==='

            for x in \
              ip \
              curl \
              wget \
              sshd \
              tmux \
              vim \
              lspci \
              dmidecode \
              nvme \
              smartctl \
              modprobe \
              lsmod \
              ethtool \
              minicom \
              sz \
              rz \
              kermit
            do
              echo
              echo \"=== \$x ===\"
              which \$x || true
            done
          "

      ######################################################################
      # IMPORTANT:
      # Reset ownership before image generation.
      #
      # This fixes:
      #   unsafe path transition / (owned by 1001)
      #
      # Caused by GitHub Actions UID leakage into the image tree.
      ######################################################################

      - name: Fix filesystem ownership
        run: |
          sudo chown -R root:root rootfs

          sudo chmod 755 rootfs

      ######################################################################
      # Unmount chroot pseudo filesystems
      ######################################################################

      - name: Unmount chroot filesystems
        run: |
          sudo umount rootfs/dev/pts || true
          sudo umount rootfs/dev || true
          sudo umount rootfs/proc || true
          sudo umount rootfs/sys || true

      ######################################################################
      # Copy rootfs into initrd tree
      ######################################################################

      - name: Copy rootfs into initrd tree
        run: |
          sudo rsync -aHAX \
            --exclude=/proc/* \
            --exclude=/sys/* \
            --exclude=/dev/* \
            --exclude=/run/* \
            --exclude=/tmp/* \
            rootfs/ initrd-tree/

      ######################################################################
      # Install init process
      ######################################################################

      - name: Install bootstrap init
        run: |
          cat << 'EOF' | sudo tee initrd-tree/init
          #!/bin/sh

          #
          # Minimal initramfs bootstrap.
          #
          # Mount required pseudo filesystems
          # then hand off to systemd.
          #

          mount -t devtmpfs devtmpfs /dev
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t tmpfs tmpfs /run

          mkdir -p /run/lock
          mkdir -p /var/run

          exec /lib/systemd/systemd
          EOF

          sudo chmod +x initrd-tree/init

      ######################################################################
      # MOTD / shell profile
      ######################################################################

      - name: Install MOTD and shell config
        run: |
          sudo cp initramfs/motd initrd-tree/etc/motd || true
          sudo cp initramfs/bashrc initrd-tree/root/.bashrc || true

      ######################################################################
      # Collector + overlay payload
      ######################################################################

      - name: Copy collector and overlay
        run: |
          sudo mkdir -p initrd-tree/collector
          sudo mkdir -p initrd-tree/overlay

          sudo cp -r collector/* initrd-tree/collector/ || true
          sudo cp -r overlay/* initrd-tree/overlay/ || true

      ######################################################################
      # Runtime directories
      ######################################################################

      - name: Create runtime directories
        run: |
          sudo mkdir -p initrd-tree/run
          sudo mkdir -p initrd-tree/run/sshd
          sudo mkdir -p initrd-tree/var/run/sshd
          sudo mkdir -p initrd-tree/tmp
          sudo mkdir -p initrd-tree/root

      ######################################################################
      # Device nodes
      ######################################################################

      - name: Create device nodes
        run: |
          sudo mkdir -p initrd-tree/dev

          sudo mknod -m 622 initrd-tree/dev/console c 5 1 || true
          sudo mknod -m 666 initrd-tree/dev/null c 1 3 || true
          sudo mknod -m 666 initrd-tree/dev/tty c 5 0 || true
          sudo mknod -m 666 initrd-tree/dev/ttyS0 c 4 64 || true

      ######################################################################
      # Final initramfs
      ######################################################################

      - name: Build final initramfs
        run: |
          cd initrd-tree

          sudo find . -print0 \
            | sudo cpio --null -ov --format=newc \
            | gzip -9 \
            > ../initramfs-amd64.cpio.gz

      ######################################################################
      # Upload artifact
      ######################################################################

      - name: Upload initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-amd64
          path: initramfs-amd64.cpio.gz

      ######################################################################
      # GitHub Release
      ######################################################################

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: provisioning-runtime
          files: initramfs-amd64.cpio.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
