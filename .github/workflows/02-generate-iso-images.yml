name: Build Spejder ISO Images

# Version history:
# 0.1.0 - Initial ISO build workflow
# 0.1.1 - Add AMD64 BIOS+UEFI hybrid ISO support via grub-mkrescue
# 0.1.2 - Add ARM64 UEFI ISO support
# 0.1.3 - Add artifact uploads and GitHub release publishing
# 0.1.4 - Add ISO verification and prettier build logging
# 0.1.5 - Simplify runtime asset handling; kernels/initramfs sourced directly from repository

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  RELEASE_VERSION: 0.1.5

jobs:

  build-iso:
    name: Build ${{ matrix.arch }} ISO
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:

          ###################################################################### AMD64 ######################################################################
          - arch: amd64
            iso_name: spejder-amd64-${{ env.RELEASE_VERSION }}.iso
            kernel_file: build/linux-amd64
            initrd_file: build/initramfs-amd64.cpio.gz
            serial_console: ttyS0

            grub_packages: >
              grub-pc-bin
              grub-efi-amd64-bin

          ###################################################################### ARM64 ######################################################################
          - arch: arm64
            iso_name: spejder-arm64-${{ env.RELEASE_VERSION }}.iso
            kernel_file: build/linux-arm64
            initrd_file: build/initramfs-arm64.cpio.gz
            serial_console: ttyAMA0

            grub_packages: >
              grub-efi-arm64-bin

    steps:

      ###################################################################### Checkout ######################################################################
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      ###################################################################### Install build dependencies ######################################################################
      - name: Install ISO build dependencies
        run: |
          echo "[*] Installing GRUB and ISO tooling..."
          sudo apt-get update
          sudo apt-get install -y xorriso mtools grub-common grub2-common
          ${{ matrix.grub_packages }}

      ###################################################################### Verify runtime assets ######################################################################
      - name: Verify runtime assets
        run: |
          echo "[*] Verifying kernel and initramfs presence..."
          test -f "${{ matrix.kernel_file }}"
          test -f "${{ matrix.initrd_file }}"

          echo
          echo "=== KERNEL ==="
          ls -lh "${{ matrix.kernel_file }}"

          echo
          echo "=== INITRAMFS ==="
          ls -lh "${{ matrix.initrd_file }}"

      ###################################################################### Create ISO tree ######################################################################
      - name: Create ISO tree
        run: |
          echo "[*] Creating ISO filesystem layout..."

          rm -rf iso
          mkdir -p iso/boot/grub
          cp "${{ matrix.kernel_file }}" iso/linux
          cp "${{ matrix.initrd_file }}" iso/

      ###################################################################### Generate GRUB configuration ######################################################################
      - name: Generate grub.cfg
        run: |
          echo "[*] Generating GRUB configuration..."

          cat > iso/boot/grub/grub.cfg <<EOF
          set timeout=2
          set default=0

          menuentry "Spejder Debian Hardware Provisioning Runtime (${{ matrix.arch }})" {

              linux /linux console=${{ matrix.serial_console }},115200 console=tty0 rw net.ifnames=0 biosdevname=0 quiet
              initrd /$(basename "${{ matrix.initrd_file }}")
          }
          EOF

          echo
          echo "=== grub.cfg ==="
          cat iso/boot/grub/grub.cfg

      ###################################################################### Build ISO ######################################################################
      - name: Build ISO image
        run: |
          echo "[*] Building bootable ISO..."
          grub-mkrescue -volid "SPEJDER_${{ matrix.arch }}" -o "${{ matrix.iso_name }}" iso/

      ###################################################################### Verify ISO ######################################################################
      - name: Verify ISO image
        run: |
          echo
          echo "=== ISO FILE ==="
          ls -lh "${{ matrix.iso_name }}"

          echo
          echo "=== FILE OUTPUT ==="
          file "${{ matrix.iso_name }}"

          echo
          echo "=== ISO CONTENTS ==="
          xorriso -indev "${{ matrix.iso_name }}" -ls /

      ###################################################################### Upload ISO artifacts ######################################################################
      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spejder-${{ matrix.arch }}-iso
          path: |
            ${{ matrix.iso_name }}

      ###################################################################### Publish GitHub release ######################################################################
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          files: |
            ${{ matrix.iso_name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
