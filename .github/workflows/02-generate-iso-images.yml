name: (Step 02) Build Spejder ISO Images

# Version history:
# 0.1.0 - Initial ISO build workflow
# 0.1.1 - Add AMD64 BIOS+UEFI hybrid ISO support via grub-mkrescue
# 0.1.2 - Add ARM64 UEFI ISO support
# 0.1.3 - Add artifact uploads and GitHub release publishing
# 0.1.4 - Extract kernels directly from verified Debian kernel packages in sources/
# 0.1.5 - Add ISO verification and prettier logging
# 0.1.6 - Add LFS storage safety valve; use pre-extracted kernel binary from sources/

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  RELEASE_VERSION: 0.1.6

jobs:

  build-iso:
    name: Build ${{ matrix.arch }} ISO
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:

          ###################################################################### AMD64 ######################################################################
          - arch: amd64
            iso_basename: spejder-amd64
            kernel_deb: sources/linux-image-6.12.73+deb13-amd64_6.12.73-1_amd64.deb
            initrd_file: initramfs-amd64.cpio.zst
            serial_console: ttyS0
            grub_packages: grub-pc-bin grub-efi-amd64-bin

          ###################################################################### ARM64 ######################################################################
          - arch: arm64
            iso_basename: spejder-arm64
            kernel_deb: sources/linux-image-6.12.73+deb13-arm64_6.12.73-1_arm64.deb
            initrd_file: initramfs-arm64.cpio.zst
            serial_console: ttyAMA0
            grub_packages: grub-efi-arm64-bin

    steps:

      ###################################################################### Checkout ######################################################################
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      ###################################################################### LFS storage safety valve ######################################################################
      # Exit early if Git LFS storage is approaching the 1GB free tier limit
      - name: Check Git LFS storage usage
        run: |
          echo "[*] Checking Git LFS storage usage..."
          LFS_BYTES=$(git lfs ls-files -s 2>/dev/null | awk '{
            val=$NF; unit=$(NF-1)
            if (unit == "MB") val=val*1024*1024
            else if (unit == "GB") val=val*1024*1024*1024
            else if (unit == "KB") val=val*1024
            sum+=val
          } END {printf "%.0f", sum}')
          LFS_MB=$((LFS_BYTES / 1024 / 1024))
          echo "[*] Current LFS usage: ${LFS_MB} MB"
          if [ "${LFS_MB}" -gt 900 ]; then
            echo ""
            echo "============================================================"
            echo "WARNING: Git LFS storage is ${LFS_MB} MB - approaching 1GB limit"
            echo "Free tier limit is 1GB. Please:"
            echo "  1. Remove old kernel debs from sources/ with git rm"
            echo "  2. Run: git lfs prune"
            echo "  3. Push the cleanup before running this workflow again"
            echo "============================================================"
            exit 1
          fi
          echo "[*] LFS storage OK (${LFS_MB} MB / 900 MB threshold)"

      ###################################################################### Define ISO filename ######################################################################
      - name: Define ISO filename
        run: |
          echo "ISO_NAME=${{ matrix.iso_basename }}-${RELEASE_VERSION}.iso" >> $GITHUB_ENV

      ###################################################################### Install build dependencies ######################################################################
      - name: Install ISO build dependencies
        run: |
          echo "[*] Installing ISO build dependencies..."
          sudo apt-get update
          sudo apt-get install -y \
            xorriso \
            mtools \
            grub-common \
            grub2-common \
            dpkg-dev \
            ${{ matrix.grub_packages }}

      ###################################################################### Download initramfs artifact from step 01 ######################################################################
      - name: Download initramfs artifact
        uses: actions/download-artifact@v4
        with:
          name: initramfs-${{ matrix.arch }}

      ###################################################################### Verify runtime assets ######################################################################
      - name: Verify runtime assets
        run: |
          echo "[*] Verifying runtime assets..."
          test -f "${{ matrix.kernel_deb }}" || { echo "[!] ERROR: kernel deb not found at ${{ matrix.kernel_deb }}"; exit 1; }
          test -f "${{ matrix.initrd_file }}" || { echo "[!] ERROR: initramfs not found: ${{ matrix.initrd_file }}"; exit 1; }
          echo ""
          echo "=== KERNEL DEB ==="
          ls -lh "${{ matrix.kernel_deb }}"
          echo ""
          echo "=== INITRAMFS ==="
          ls -lh "${{ matrix.initrd_file }}"

      ###################################################################### Extract kernel image ######################################################################
      # Uses pre-extracted binary from sources/ if available, otherwise extracts from deb
      - name: Extract kernel image
        run: |
          KERNEL_BINARY="sources/linux-${{ matrix.arch }}"
          if [ -f "${KERNEL_BINARY}" ]; then
            echo "[*] Using pre-extracted kernel binary from sources/"
            cp "${KERNEL_BINARY}" "linux-${{ matrix.arch }}"
          else
            echo "[*] Extracting kernel from Debian package..."
            rm -rf kernel-extract && mkdir -p kernel-extract
            dpkg-deb -x "${{ matrix.kernel_deb }}" kernel-extract
            KERNEL_PATH=$(find kernel-extract/boot -name 'vmlinuz-*' | head -n1)
            if [ -z "${KERNEL_PATH}" ]; then
              echo "[!] ERROR: unable to locate kernel image"
              exit 1
            fi
            cp "${KERNEL_PATH}" "linux-${{ matrix.arch }}"
            rm -rf kernel-extract
          fi
          echo ""
          echo "=== KERNEL ==="
          ls -lh "linux-${{ matrix.arch }}"

      ###################################################################### Create ISO tree ######################################################################
      - name: Create ISO tree
        run: |
          echo "[*] Creating ISO filesystem tree..."
          rm -rf iso
          mkdir -p iso/boot/grub
          cp "linux-${{ matrix.arch }}" iso/linux
          cp "${{ matrix.initrd_file }}" iso/

      ###################################################################### Generate GRUB configuration ######################################################################
      - name: Generate grub.cfg
        run: |
          echo "[*] Generating GRUB configuration..."
          cat > iso/boot/grub/grub.cfg << EOF
          set timeout=5
          set default=0

          menuentry "Spejder - Hardware Provisioning Runtime (${{ matrix.arch }})" {
              linux /linux \
                  console=${{ matrix.serial_console }},115200 \
                  console=tty0 \
                  rw \
                  net.ifnames=0 \
                  biosdevname=0 \
                  quiet
              initrd /$(basename "${{ matrix.initrd_file }}")
          }

          menuentry "Spejder - Verbose boot (${{ matrix.arch }})" {
              linux /linux \
                  console=${{ matrix.serial_console }},115200 \
                  console=tty0 \
                  rw \
                  net.ifnames=0 \
                  biosdevname=0
              initrd /$(basename "${{ matrix.initrd_file }}")
          }
          EOF
          echo ""
          echo "=== grub.cfg ==="
          cat iso/boot/grub/grub.cfg

      ###################################################################### Build ISO ######################################################################
      - name: Build ISO image
        run: |
          echo "[*] Building bootable ISO..."
          grub-mkrescue \
            -volid "SPEJDER_${{ matrix.arch }}" \
            -o "${ISO_NAME}" \
            iso/

      ###################################################################### Verify ISO ######################################################################
      - name: Verify ISO image
        run: |
          echo ""
          echo "=== ISO FILE ==="
          ls -lh "${ISO_NAME}"
          echo ""
          echo "=== FILE TYPE ==="
          file "${ISO_NAME}"
          echo ""
          echo "=== ISO CONTENTS ==="
          xorriso -indev "${ISO_NAME}" -ls / 2>/dev/null || true

      ###################################################################### Upload ISO artifacts ######################################################################
      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spejder-${{ matrix.arch }}-iso
          path: |
            ${{ env.ISO_NAME }}

      ###################################################################### Publish GitHub release ######################################################################
      # ISO included in the same release as the initramfs and kernel from step 01
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          body: |
            ## Spejder v${{ env.RELEASE_VERSION }}

            Minimal stateless hardware provisioning runtime built on Debian Trixie.

            ### Downloads

            | File | Architecture | Use |
            |------|-------------|-----|
            | `spejder-amd64-*.iso` | amd64 | Bootable ISO - burn to USB or mount in VM |
            | `spejder-arm64-*.iso` | arm64 | Bootable ISO - UEFI boot |
            | `initramfs-amd64.cpio.gz` | amd64 | iPXE/PXE initramfs |
            | `initramfs-arm64.cpio.gz` | arm64 | iPXE/PXE initramfs |
            | `linux-amd64` | amd64 | Extracted kernel binary for iPXE/PXE |
            | `linux-arm64` | arm64 | Extracted kernel binary for iPXE/PXE |

            ### iPXE boot
            See `ipxe/discovery.ipxe` in the repository.
          files: |
            ${{ env.ISO_NAME }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
