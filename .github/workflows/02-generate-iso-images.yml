name: (Step 02) Build Spejder ISO Images

# Version history:
# 0.1.0 - Initial ISO build workflow
# 0.1.1 - Add AMD64 BIOS+UEFI hybrid ISO support via grub-mkrescue
# 0.1.2 - Add ARM64 UEFI ISO support
# 0.1.3 - Add artifact uploads and GitHub release publishing
# 0.1.4 - Extract kernels directly from verified Debian kernel packages in sources/
# 0.1.5 - Add ISO verification and prettier logging
# 0.1.6 - Add LFS storage safety valve; use pre-extracted kernel binary from sources/
# 0.2.0 - Reworked ISO pipeline to consume GitHub Release assets instead of Actions artifacts
# 0.2.1 - Added release validation and workflow_dispatch release selection
# 0.2.2 - Align ISO workflow architecture naming with runtime workflow via ipxe_arch

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to consume (example: v0.1.7)"
        required: true
        default: "v0.1.7"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_VERSION: ${{ inputs.release_tag }}

jobs:

  build-iso:
    name: Build ${{ matrix.arch }} ISO
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:

          ########## AMD64 ##########
          - arch: amd64
            ipxe_arch: x86_64
            iso_basename: spejder-amd64
            serial_console: ttyS0

          ########## ARM64 ##########
          - arch: arm64
            ipxe_arch: arm64
            iso_basename: spejder-arm64
            serial_console: ttyAMA0

    steps:

      ########## Checkout repository ##########
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      ########## Define ISO filename ##########
      - name: Define ISO filename
        run: |
          VERSION_CLEAN="${RELEASE_VERSION#v}"

          echo "VERSION_CLEAN=${VERSION_CLEAN}" >> $GITHUB_ENV
          echo "ISO_NAME=${{ matrix.iso_basename }}-${VERSION_CLEAN}.iso" >> $GITHUB_ENV
          echo ""
          echo "=== BUILD INFO ==="
          echo "Release tag : ${RELEASE_VERSION}"
          echo "ISO filename: ${{ matrix.iso_basename }}-${VERSION_CLEAN}.iso"

      ########## Install ISO build dependencies ##########
      - name: Install ISO build dependencies
        run: |
          echo "[*] Installing ISO build dependencies..."
          sudo apt-get update
          sudo apt-get install -y xorriso mtools grub-common grub2-common grub-pc-bin grub-efi-amd64-bin dpkg-dev gh

      ########## Verify release exists ##########
      - name: Verify GitHub release exists
        run: |
          echo "[*] Checking release ${RELEASE_VERSION}..."
          gh release view "${RELEASE_VERSION}"
          echo ""
          echo "=== RELEASE ASSETS ==="
          gh release view "${RELEASE_VERSION}" --json assets --jq '.assets[].name'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      ########## Download runtime assets ##########
      - name: Download runtime assets from release
        run: |
          echo "[*] Downloading runtime assets from GitHub Release..."
          mkdir -p "spejder/${{ matrix.ipxe_arch }}"

          echo ""
          echo "=== AVAILABLE ASSETS ==="
          gh release view "${RELEASE_VERSION}" --json assets --jq '.assets[].name'

          echo ""
          echo "=== DOWNLOADING INITRAMFS ==="
          gh release download "${RELEASE_VERSION}" --pattern "initramfs-${{ matrix.ipxe_arch }}*" --dir "spejder/${{ matrix.ipxe_arch }}"

          echo ""
          echo "=== DOWNLOADING KERNEL ==="
          gh release download "${RELEASE_VERSION}" --pattern "linux-${{ matrix.ipxe_arch }}*" --dir "spejder/${{ matrix.ipxe_arch }}"

          echo ""
          echo "=== DOWNLOADED FILES ==="
          find spejder -type f -ls
        env:
          GITHUB_TOKEN: ${{ github.token }}

      ########## Verify runtime assets ##########
      - name: Verify runtime assets
        run: |
          echo "[*] Verifying runtime assets..."
          INITRD=$(find spejder -name "*.cpio.zst" | head -n1)
          KERNEL=$(find spejder -name "linux-*" | head -n1)

          test -f "${INITRD}" || {
            echo "[!] ERROR: initramfs missing"
            exit 1
          }

          test -f "${KERNEL}" || {
            echo "[!] ERROR: kernel missing"
            exit 1
          }

          echo "INITRD_PATH=${INITRD}" >> $GITHUB_ENV
          echo "KERNEL_PATH=${KERNEL}" >> $GITHUB_ENV

          echo ""
          echo "=== INITRAMFS ==="
          ls -lh "${INITRD}"

          echo ""
          echo "=== KERNEL ==="
          ls -lh "${KERNEL}"

      ########## Create ISO tree ##########
      - name: Create ISO tree
        run: |
          echo "[*] Creating ISO filesystem tree..."
          rm -rf iso
          mkdir -p iso/boot/grub
          cp "${KERNEL_PATH}" iso/linux
          cp "${INITRD_PATH}" iso/
          echo ""
          echo "=== ISO TREE ==="
          find iso -type f -ls

      ########## Generate grub.cfg ##########
      - name: Generate grub.cfg
        run: |
          INITRD_FILENAME=$(basename "${INITRD_PATH}")
          echo "[*] Generating GRUB configuration..."
          cat > iso/boot/grub/grub.cfg << EOF
          set timeout=5
          set default=0
          menuentry "Spejder - Hardware Provisioning Runtime (${{ matrix.arch }})" {
            linux /linux console=${{ matrix.serial_console }},115200 console=tty0 rw net.ifnames=0 biosdevname=0 quiet
            initrd /${INITRD_FILENAME}
          }

          menuentry "Spejder - Verbose boot (${{ matrix.arch }})" {
            linux /linux console=${{ matrix.serial_console }},115200 console=tty0 rw net.ifnames=0 biosdevname=0
            initrd /${INITRD_FILENAME}
          }
          EOF

          echo ""
          echo "=== grub.cfg ==="
          cat iso/boot/grub/grub.cfg

      ########## Build ISO ##########
      - name: Build ISO image
        run: |
          echo "[*] Building bootable ISO..."
          grub-mkrescue --compress=xz -volid "SPEJDER_${{ matrix.arch }}" -o "${ISO_NAME}" iso/

      ########## Verify ISO ##########
      - name: Verify ISO image
        run: |
          echo ""
          echo "=== ISO FILE ==="
          ls -lh "${ISO_NAME}"
          echo ""
          echo "=== FILE TYPE ==="
          file "${ISO_NAME}"
          echo ""
          echo "=== ISO CONTENTS ==="
          xorriso -indev "${ISO_NAME}" -ls / 2>/dev/null || true

      ########## Upload ISO artifact ##########
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: spejder-${{ matrix.arch }}-iso
          path: |
            ${{ env.ISO_NAME }}

      ########## Publish ISO to existing GitHub Release ##########
      - name: Publish ISO to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            ${{ env.ISO_NAME }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
