name: (Step 00) Spejder Pre-flight Cache Warmer

# Version history:
# 0.1.0 - Initial preflight workflow
# 0.1.1 - Fix git add -f to bypass gitignore on runner
# 0.1.2 - Fix apt cache path to exclude lock and partial files
# 0.1.3 - Add git lfs install for kernel debs > 100MB
# 0.1.4 - Add SHA256 verification for kernel debs (checksums from packages.debian.org);
#          detect and reject LFS pointer files; kernel_sha256 in matrix
# 0.1.5 - Add LFS storage safety valve (exit if > 900MB used)
#
# Run this manually when you want to refresh cached artefacts or after a kernel version bump. This
# workflow downloads kernel debs, commits them to sources/ via Git LFS, extracts the kernel binary,
# and pre-warms firmware and apt package caches.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:

  preflight:
    name: Pre-flight ${{ matrix.arch }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:
          - arch: amd64
            kernel_version: 6.12.73+deb13-amd64
            kernel_deb: linux-image-6.12.73+deb13-amd64_6.12.73-1_amd64.deb
            kernel_url: http://ftp.dk.debian.org/debian/pool/main/l/linux-signed-amd64/linux-image-6.12.73+deb13-amd64_6.12.73-1_amd64.deb
            # SHA256 from https://packages.debian.org/trixie/amd64/linux-image-6.12.73+deb13-amd64/download
            kernel_sha256: 1589680329195482fb67cab331c6fc7bb71bd4d4f68fae16b4c5d191636d236f

          - arch: arm64
            kernel_version: 6.12.73+deb13-arm64
            kernel_deb: linux-image-6.12.73+deb13-arm64_6.12.73-1_arm64.deb
            kernel_url: http://ftp.dk.debian.org/debian/pool/main/l/linux-signed-arm64/linux-image-6.12.73+deb13-arm64_6.12.73-1_arm64.deb
            # SHA256 from https://packages.debian.org/trixie/arm64/linux-image-6.12.73+deb13-arm64/download
            kernel_sha256: 98fadebbd8d967df37ae5b931c0a8e2720cfceb76a2e1961f6fa3e9141632521

    env:
      DEBIAN_RELEASE: trixie
      DEBIAN_MIRROR: http://deb.debian.org/debian

    steps:

      ###################################################################### Checkout ######################################################################
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      ###################################################################### LFS storage safety valve ######################################################################
      # Exit early if Git LFS storage is approaching the 1GB free tier limit
      # Prevents silent overages - update the kernel version and re-run preflight to rotate old debs out
      - name: Check Git LFS storage usage
        run: |
          echo "[*] Checking Git LFS storage usage..."
          LFS_BYTES=$(git lfs ls-files -s 2>/dev/null | awk '{
            val=$NF; unit=$(NF-1)
            if (unit == "MB") val=val*1024*1024
            else if (unit == "GB") val=val*1024*1024*1024
            else if (unit == "KB") val=val*1024
            sum+=val
          } END {printf "%.0f", sum}')
          LFS_MB=$((LFS_BYTES / 1024 / 1024))
          echo "[*] Current LFS usage: ${LFS_MB} MB"
          if [ "${LFS_MB}" -gt 900 ]; then
            echo ""
            echo "============================================================"
            echo "WARNING: Git LFS storage is ${LFS_MB} MB - approaching 1GB limit"
            echo "Free tier limit is 1GB. Please:"
            echo "  1. Remove old kernel debs from sources/ with git rm"
            echo "  2. Run: git lfs prune"
            echo "  3. Push the cleanup before running pre-flight again"
            echo "============================================================"
            exit 1
          fi
          echo "[*] LFS storage OK (${LFS_MB} MB / 900 MB threshold)"

      ###################################################################### Build host apt cache ######################################################################
      - name: Cache build host apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
          key: build-apt-${{ hashFiles('build/build_packages.txt', 'build/shared_packages.txt') }}
          restore-keys: build-apt-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(grep -v '^\s*#' build/build_packages.txt | grep -v '^\s*$' | tr -d '\r')
          sudo apt-get install -y $(grep -v '^\s*#' build/shared_packages.txt | grep -v '^\s*$' | tr -d '\r')

      ###################################################################### Kernel deb - verify existing or download fresh ######################################################################
      # Checksums sourced from packages.debian.org - update alongside kernel version bumps
      # LFS pointer files (< 1MB) are detected, removed, and re-downloaded automatically
      - name: Check kernel deb in sources/
        id: kernel_check
        run: |
          KERNEL_DEB="${{ matrix.kernel_deb }}"
          EXPECTED_SHA256="${{ matrix.kernel_sha256 }}"
          NEEDS_DOWNLOAD=true

          if [ -f "sources/${KERNEL_DEB}" ]; then
            ACTUAL_SIZE=$(wc -c < "sources/${KERNEL_DEB}")
            if [ "${ACTUAL_SIZE}" -lt 1000000 ]; then
              echo "[!] sources/${KERNEL_DEB} is ${ACTUAL_SIZE} bytes - LFS pointer or corrupt, will re-download"
              git rm -f "sources/${KERNEL_DEB}" || rm -f "sources/${KERNEL_DEB}"
            else
              ACTUAL_SHA256=$(sha256sum "sources/${KERNEL_DEB}" | awk '{print $1}')
              if [ "${ACTUAL_SHA256}" = "${EXPECTED_SHA256}" ]; then
                echo "[*] sources/${KERNEL_DEB} SHA256 verified - no download needed"
                NEEDS_DOWNLOAD=false
              else
                echo "[!] SHA256 mismatch on sources/${KERNEL_DEB}"
                echo "[!] Expected: ${EXPECTED_SHA256}"
                echo "[!] Got:      ${ACTUAL_SHA256}"
                echo "[!] Removing and re-downloading"
                git rm -f "sources/${KERNEL_DEB}" || rm -f "sources/${KERNEL_DEB}"
              fi
            fi
          else
            echo "[*] sources/${KERNEL_DEB} not present - will download"
          fi

          echo "needs_download=${NEEDS_DOWNLOAD}" >> $GITHUB_OUTPUT

      - name: Download kernel deb
        if: steps.kernel_check.outputs.needs_download == 'true'
        run: |
          mkdir -p sources
          KERNEL_DEB="${{ matrix.kernel_deb }}"
          EXPECTED_SHA256="${{ matrix.kernel_sha256 }}"

          echo "[*] Downloading ${KERNEL_DEB}..."
          wget -O "sources/${KERNEL_DEB}" "${{ matrix.kernel_url }}"

          ACTUAL_SHA256=$(sha256sum "sources/${KERNEL_DEB}" | awk '{print $1}')
          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "[!] ERROR: downloaded kernel deb failed SHA256 verification"
            echo "[!] Expected: ${EXPECTED_SHA256}"
            echo "[!] Got:      ${ACTUAL_SHA256}"
            rm -f "sources/${KERNEL_DEB}"
            exit 1
          fi
          echo "[*] SHA256 verified: ${ACTUAL_SHA256}"
          echo "[*] Size: $(wc -c < "sources/${KERNEL_DEB}") bytes"

      ###################################################################### Extract kernel binary from deb ######################################################################
      # Extracts vmlinuz so releases have a standalone kernel without needing to unpack the deb
      - name: Extract kernel binary
        run: |
          echo "[*] Extracting kernel binary from deb..."
          rm -rf extract
          mkdir extract
          dpkg-deb -x "sources/${{ matrix.kernel_deb }}" extract

          KERNEL=$(find extract/boot -type f -name "vmlinuz-*" | head -n1)
          if [ -z "${KERNEL}" ]; then
            echo "[!] ERROR: no vmlinuz found inside deb"
            exit 1
          fi

          OUT="sources/linux-${{ matrix.arch }}"
          cp "${KERNEL}" "${OUT}"
          echo "[*] Extracted kernel: ${OUT}"
          ls -lh "${OUT}"
          rm -rf extract

      - name: Commit kernel deb and binary to sources/ via Git LFS
        if: steps.kernel_check.outputs.needs_download == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install
          git add -f "sources/${{ matrix.kernel_deb }}"
          git add -f "sources/linux-${{ matrix.arch }}"
          git commit -m "preflight: add kernel deb and binary for ${{ matrix.arch }} (SHA256 verified)"
          git push
        env:
          GITHUB_TOKEN: ${{ github.token }}

      ###################################################################### Firmware deb cache ######################################################################
      - name: Cache firmware debs
        uses: actions/cache@v4
        id: firmware_cache
        with:
          path: sources/firmware-${{ matrix.arch }}
          key: firmware-${{ matrix.arch }}-${{ env.DEBIAN_RELEASE }}-${{ hashFiles('build/initrd_packages.txt') }}
          restore-keys: firmware-${{ matrix.arch }}-${{ env.DEBIAN_RELEASE }}-

      - name: Download and cache firmware debs
        if: steps.firmware_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sources/firmware-${{ matrix.arch }}
          sudo rm -rf firmware-bootstrap

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo debootstrap --arch=arm64 --variant=minbase --foreign ${DEBIAN_RELEASE} firmware-bootstrap ${DEBIAN_MIRROR}
            sudo cp /usr/bin/qemu-aarch64-static firmware-bootstrap/usr/bin/
            sudo chroot firmware-bootstrap /debootstrap/debootstrap --second-stage
          else
            sudo debootstrap --arch=amd64 --variant=minbase ${DEBIAN_RELEASE} firmware-bootstrap ${DEBIAN_MIRROR}
          fi

          sudo chroot firmware-bootstrap /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            echo 'deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware' > /etc/apt/sources.list
            apt-get update
            apt-get install -y --no-install-recommends firmware-linux-free firmware-misc-nonfree firmware-realtek
            apt-get clean
          "

          sudo find firmware-bootstrap/var/cache/apt/archives/ -name '*.deb' \
            -exec cp {} sources/firmware-${{ matrix.arch }}/ \;
          echo "[*] Cached $(ls sources/firmware-${{ matrix.arch }}/*.deb | wc -l) firmware debs"
          sudo rm -rf firmware-bootstrap

      ###################################################################### Rootfs apt cache ######################################################################
      - name: Cache rootfs apt packages
        uses: actions/cache@v4
        id: rootfs_cache
        with:
          path: sources/rootfs-apt-${{ matrix.arch }}
          key: rootfs-apt-${{ matrix.arch }}-${{ env.DEBIAN_RELEASE }}-${{ hashFiles('build/shared_packages.txt', 'build/initrd_packages.txt') }}
          restore-keys: rootfs-apt-${{ matrix.arch }}-${{ env.DEBIAN_RELEASE }}-

      - name: Pre-warm rootfs apt cache
        if: steps.rootfs_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sources/rootfs-apt-${{ matrix.arch }}
          sudo rm -rf rootfs-preflight

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo debootstrap --arch=arm64 --variant=minbase --foreign ${DEBIAN_RELEASE} rootfs-preflight ${DEBIAN_MIRROR}
            sudo cp /usr/bin/qemu-aarch64-static rootfs-preflight/usr/bin/
            sudo chroot rootfs-preflight /debootstrap/debootstrap --second-stage
          else
            sudo debootstrap --arch=amd64 --variant=minbase ${DEBIAN_RELEASE} rootfs-preflight ${DEBIAN_MIRROR}
          fi

          sudo cp build/shared_packages.txt rootfs-preflight/root/shared_packages.txt
          sudo cp build/initrd_packages.txt rootfs-preflight/root/initrd_packages.txt

          sudo chroot rootfs-preflight /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            echo 'deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware' > /etc/apt/sources.list
            apt-get update
            grep -v '^\s*#' /root/shared_packages.txt | grep -v '^\s*$' | tr -d '\r' > /root/install.txt
            grep -v '^\s*#' /root/initrd_packages.txt | grep -v '^\s*$' | tr -d '\r' >> /root/install.txt
            apt-get install -y --no-install-recommends \$(cat /root/install.txt)
          "

          sudo find rootfs-preflight/var/cache/apt/archives/ -name '*.deb' \
            -exec cp {} sources/rootfs-apt-${{ matrix.arch }}/ \;
          echo "[*] Cached $(ls sources/rootfs-apt-${{ matrix.arch }}/*.deb | wc -l) rootfs apt debs"

          sudo chroot rootfs-preflight /bin/bash -c "dpkg -l" \
            > sources/rootfs-apt-${{ matrix.arch }}/installed-manifest-${{ matrix.arch }}.txt
          echo "[*] Package manifest written"

          sudo rm -rf rootfs-preflight

      ###################################################################### Summary ######################################################################
      - name: Pre-flight summary
        run: |
          echo "=================================================="
          echo "Pre-flight complete for ${{ matrix.arch }}"
          echo "=================================================="
          echo ""
          echo "Kernel deb:    sources/${{ matrix.kernel_deb }}"
          if [ -f "sources/${{ matrix.kernel_deb }}" ]; then
            echo "Kernel size:   $(wc -c < "sources/${{ matrix.kernel_deb }}") bytes"
            echo "Kernel SHA256: $(sha256sum "sources/${{ matrix.kernel_deb }}" | awk '{print $1}')"
          fi
          if [ -f "sources/linux-${{ matrix.arch }}" ]; then
            echo "Kernel binary: sources/linux-${{ matrix.arch }} ($(wc -c < "sources/linux-${{ matrix.arch }}") bytes)"
          fi
          echo ""
          if [ -d "sources/firmware-${{ matrix.arch }}" ]; then
            echo "Firmware debs: $(ls sources/firmware-${{ matrix.arch }}/*.deb 2>/dev/null | wc -l) packages"
          fi
          if [ -d "sources/rootfs-apt-${{ matrix.arch }}" ]; then
            echo "Rootfs debs:   $(ls sources/rootfs-apt-${{ matrix.arch }}/*.deb 2>/dev/null | wc -l) packages"
          fi
          if [ -f "sources/rootfs-apt-${{ matrix.arch }}/installed-manifest-${{ matrix.arch }}.txt" ]; then
            echo "Manifest pkgs: $(grep -c '^ii' sources/rootfs-apt-${{ matrix.arch }}/installed-manifest-${{ matrix.arch }}.txt || true)"
          fi
          echo ""
          LFS_BYTES=$(git lfs ls-files -s 2>/dev/null | awk '{
            val=$NF; unit=$(NF-1)
            if (unit == "MB") val=val*1024*1024
            else if (unit == "GB") val=val*1024*1024*1024
            else if (unit == "KB") val=val*1024
            sum+=val
          } END {printf "%.0f", sum}')
          LFS_MB=$((LFS_BYTES / 1024 / 1024))
          echo "LFS usage:     ${LFS_MB} MB / 900 MB threshold"
