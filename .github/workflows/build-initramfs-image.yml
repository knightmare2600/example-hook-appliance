name: Build Initramfs (Provisioning Agent)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Kernel Build (Precompiled)"]
    types:
      - completed

env:
  KERNEL_VERSION: 5.10.255

permissions:
  contents: write

jobs:
  initramfs:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install base tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static cpio gzip ipmitool pciutils util-linux debootstrap

      - name: Create staging rootfs
        run: |
          mkdir -p stage/${{ matrix.arch }}

      - name: Build minimal rootfs (debootstrap)
        run: |
          sudo debootstrap --arch=${{ matrix.arch }} --variant=minbase jammy stage/${{ matrix.arch }}

      - name: Create initramfs root
        run: |
          mkdir -p initrd/rootfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,dev,root,collector,overlay}

      - name: Copy busybox
        run: |
          cp /bin/busybox initrd/rootfs/bin/
          chmod +x initrd/rootfs/bin/busybox

      - name: Copy required binaries (safe model)
        run: |
          cp stage/${{ matrix.arch }}/usr/sbin/ipmitool initrd/rootfs/usr/sbin/ || true
          cp stage/${{ matrix.arch }}/usr/bin/dmidecode initrd/rootfs/usr/bin/ || true
          cp stage/${{ matrix.arch }}/usr/bin/lspci initrd/rootfs/usr/bin/ || true

      - name: Install init script from repo
        run: |
          cp initramfs/init initrd/rootfs/init
          chmod +x initrd/rootfs/init

      - name: Copy overlay + collector
        run: |
          cp -r collector initrd/rootfs/ || true
          cp -r overlay initrd/rootfs/ || true

      - name: Build initramfs
        run: |
          cd initrd/rootfs
          find . | cpio -H newc -o | gzip > ../../initramfs-${{ matrix.arch }}.cpio.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-${{ matrix.arch }}
          path: initramfs-${{ matrix.arch }}.cpio.gz

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ env.KERNEL_VERSION }}
          files: initramfs-${{ matrix.arch }}.cpio.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
