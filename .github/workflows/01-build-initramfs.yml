name: (Step 01) Build Provisioning Runtime

# Version history:
# 0.1.0 - Initial workflow
# 0.1.1 - Split packages.txt into shared/initrd/build lists; single-source locale.gen in shared/; strip locales package
#         post-generation; move build deps out of hardcoded apt-get line
# 0.1.2 - Enable non-free-firmware in chroot sources.list before package install; remove localepurge from
#         build_packages.txt (Debian-only, not on Ubuntu runner)
# 0.1.3 - Remove Install bootstrap init step; systemd is PID 1, no custom init script required
# 0.1.4 - Add cache restore for kernel deb (from sources/), firmware debs, and rootfs apt packages add kernel module
#         count verification; add /init symlink to systemd; add tree to packages; add autofs4 modprobe alias; fix
#         smbupload.service TTY allocation
# 0.1.5 - Add SHA256 verification for kernel debs; detect & reject LFS pointer files; kernel_sha256 in matrix; initramfs-
#         tools install/strip pattern for kernel dep; cleanup: remove kernel deb from /root, localepurge, strip man/doc
# 0.1.6 - Add LFS storage safety valve
# 0.1.7 - Revert to zstd -3 (2MB decompression RAM vs 64MB at -19); Node24 compat; v2 cache keys; enable serial-getty@ttyS0;
#          publish extracted kernel binary in release; sudo tee for manifest write

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_VERSION: 0.1.7

jobs:

  build:
    name: Build ${{ matrix.arch }} initramfs
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:
          - arch: amd64
            ipxe_arch: x86_64
            kernel_version: 6.12.73+deb13-amd64
            kernel_deb: linux-image-6.12.73+deb13-amd64_6.12.73-1_amd64.deb
            kernel_url: http://ftp.dk.debian.org/debian/pool/main/l/linux-signed-amd64/linux-image-6.12.73+deb13-amd64_6.12.73-1_amd64.deb
            # SHA256 from https://packages.debian.org/trixie/amd64/linux-image-6.12.73+deb13-amd64/download
            kernel_sha256: 1589680329195482fb67cab331c6fc7bb71bd4d4f68fae16b4c5d191636d236f

          - arch: arm64
            ipxe_arch: arm64
            kernel_version: 6.12.73+deb13-arm64
            kernel_deb: linux-image-6.12.73+deb13-arm64_6.12.73-1_arm64.deb
            kernel_url: http://ftp.dk.debian.org/debian/pool/main/l/linux-signed-arm64/linux-image-6.12.73+deb13-arm64_6.12.73-1_arm64.deb
            # SHA256 from https://packages.debian.org/trixie/arm64/linux-image-6.12.73+deb13-arm64/download
            kernel_sha256: 98fadebbd8d967df37ae5b931c0a8e2720cfceb76a2e1961f6fa3e9141632521

    env:
      DEBIAN_RELEASE: trixie
      DEBIAN_MIRROR: http://deb.debian.org/debian

    steps:

      ########## Checkout ##########
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      ########## LFS storage safety valve ##########
      # Exit early if Git LFS storage is approaching the 1GB free tier limit
      - name: Check Git LFS storage usage
        run: |
          echo "[*] Checking Git LFS storage usage..."
          LFS_BYTES=$(git lfs ls-files -s 2>/dev/null | awk '{
            val=$NF; unit=$(NF-1)
            if (unit == "MB") val=val*1024*1024
            else if (unit == "GB") val=val*1024*1024*1024
            else if (unit == "KB") val=val*1024
            sum+=val
          } END {printf "%.0f", sum}')
          LFS_MB=$((LFS_BYTES / 1024 / 1024))
          echo "[*] Current LFS usage: ${LFS_MB} MB"
          if [ "${LFS_MB}" -gt 900 ]; then
            echo ""
            echo "============================================================"
            echo "WARNING: Git LFS storage is ${LFS_MB} MB - approaching 1GB limit"
            echo "Free tier limit is 1GB. Please:"
            echo "  1. Remove old kernel debs from sources/ with git rm"
            echo "  2. Run: git lfs prune"
            echo "  3. Push the cleanup before running this workflow again"
            echo "============================================================"
            exit 1
          fi
          echo "[*] LFS storage OK (${LFS_MB} MB / 900 MB threshold)"

      ########## Build host apt cache ##########
      - name: Restore build host apt cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
          key: build-apt-v2-${{ hashFiles('build/build_packages.txt', 'build/shared_packages.txt') }}
          restore-keys: build-apt-v2-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(grep -v '^\s*#' build/build_packages.txt | grep -v '^\s*$' | tr -d '\r')
          sudo apt-get install -y $(grep -v '^\s*#' build/shared_packages.txt | grep -v '^\s*$' | tr -d '\r')

      ########## Working directories ##########
      - name: Create working directories
        run: |
          sudo rm -rf rootfs initrd-tree
          mkdir -p rootfs
          mkdir -p initrd-tree

      ########## Bootstrap Debian ##########
      - name: Bootstrap Debian rootfs
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "[*] ARM64 foreign bootstrap"
            sudo debootstrap --arch=arm64 --variant=minbase --foreign ${DEBIAN_RELEASE} rootfs ${DEBIAN_MIRROR}
            sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
            sudo chroot rootfs /debootstrap/debootstrap --second-stage
          else
            echo "[*] Native AMD64 bootstrap"
            sudo debootstrap --arch=amd64 --variant=minbase ${DEBIAN_RELEASE} rootfs ${DEBIAN_MIRROR}
          fi

      ########## Verify bootstrap ##########
      - name: Verify bootstrap
        run: |
          sudo chroot rootfs /bin/bash -c "
            echo '=== ARCHITECTURE ==='
            dpkg --print-architecture
            echo
            echo '=== BASH ==='
            ls -l /bin/bash
          "

      ########## Mount chroot filesystems ##########
      - name: Mount chroot filesystems
        run: |
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys rootfs/sys
          sudo mount --bind /dev/pts rootfs/dev/pts

      ########## Kernel deb - restore from sources/ or download, always SHA256 verified ##########
      # Checksums sourced from packages.debian.org - update alongside kernel version bumps
      # LFS pointer files (< 1MB) are detected and rejected automatically
      - name: Restore or download kernel deb
        run: |
          KERNEL_DEB="${{ matrix.kernel_deb }}"
          KERNEL_URL="${{ matrix.kernel_url }}"
          EXPECTED_SHA256="${{ matrix.kernel_sha256 }}"

          verify_sha256() {
            local FILE="$1"
            local ACTUAL
            ACTUAL=$(sha256sum "${FILE}" | awk '{print $1}')
            if [ "${ACTUAL}" = "${EXPECTED_SHA256}" ]; then
              echo "[*] SHA256 verified: ${FILE}"
              return 0
            else
              echo "[!] SHA256 mismatch on ${FILE}"
              echo "[!] Expected: ${EXPECTED_SHA256}"
              echo "[!] Got:      ${ACTUAL}"
              return 1
            fi
          }

          # Check sources/ - reject LFS pointer files and SHA256 mismatches
          if [ -f "sources/${KERNEL_DEB}" ]; then
            ACTUAL_SIZE=$(wc -c < "sources/${KERNEL_DEB}")
            if [ "${ACTUAL_SIZE}" -lt 1000000 ]; then
              echo "[!] sources/${KERNEL_DEB} is only ${ACTUAL_SIZE} bytes - LFS pointer or corrupt, ignoring"
            elif verify_sha256 "sources/${KERNEL_DEB}"; then
              echo "[*] Using verified kernel deb from sources/"
              cp "sources/${KERNEL_DEB}" "${KERNEL_DEB}"
            else
              echo "[!] Rejecting sources/${KERNEL_DEB} - SHA256 mismatch"
            fi
          fi

          # Download if not resolved from sources/
          if [ ! -f "${KERNEL_DEB}" ]; then
            echo "[*] Downloading ${KERNEL_DEB}..."
            wget -O "${KERNEL_DEB}" "${KERNEL_URL}"
            if ! verify_sha256 "${KERNEL_DEB}"; then
              echo "[!] ERROR: downloaded kernel deb failed SHA256 verification - aborting"
              rm -f "${KERNEL_DEB}"
              exit 1
            fi
          fi

          echo "[*] Kernel deb ready: $(wc -c < "${KERNEL_DEB}") bytes"

      ########## Extract kernel binary for release publishing ##########
      # Uses pre-extracted binary from sources/ if available (put there by preflight)
      # Falls back to extracting from deb if needed
      - name: Extract kernel binary
        run: |
          if [ -f "sources/linux-${{ matrix.arch }}" ]; then
            echo "[*] Using pre-extracted kernel binary from sources/"
            cp "sources/linux-${{ matrix.arch }}" "linux-${{ matrix.arch }}"
          else
            echo "[*] Extracting kernel binary from deb..."
            rm -rf extract && mkdir extract
            dpkg-deb -x "${{ matrix.kernel_deb }}" extract
            KERNEL=$(find extract/boot -type f -name "vmlinuz-*" | head -n1)
            if [ -z "${KERNEL}" ]; then
              echo "[!] ERROR: no vmlinuz found inside deb"
              exit 1
            fi
            cp "${KERNEL}" "linux-${{ matrix.arch }}"
            rm -rf extract
          fi
          echo "[*] Kernel binary: $(ls -lh linux-${{ matrix.arch }})"

      ########## Firmware deb cache ##########
      - name: Restore firmware deb cache
        uses: actions/cache@v4
        id: firmware_cache
        with:
          path: sources/firmware-${{ matrix.arch }}
          key: firmware-${{ matrix.arch }}-${{ env.DEBIAN_RELEASE }}-v2-${{ hashFiles('build/initrd_packages.txt') }}
          restore-keys: firmware-${{ matrix.arch }}-${{ env.DEBIAN_RELEASE }}-v2-

      ########## Rootfs apt cache ##########
      - name: Restore rootfs apt cache
        uses: actions/cache@v4
        id: rootfs_apt_cache
        with:
          path: sources/rootfs-apt-${{ matrix.arch }}
          key: rootfs-apt-${{ matrix.arch }}-${{ env.DEBIAN_RELEASE }}-v2-${{ hashFiles('build/shared_packages.txt', 'build/initrd_packages.txt') }}
          restore-keys: rootfs-apt-${{ matrix.arch }}-${{ env.DEBIAN_RELEASE }}-v2-

      - name: Seed rootfs apt cache into chroot
        run: |
          if [ -d "sources/rootfs-apt-${{ matrix.arch }}" ] && \
             [ "$(ls -A sources/rootfs-apt-${{ matrix.arch }}/*.deb 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "[*] Seeding $(ls sources/rootfs-apt-${{ matrix.arch }}/*.deb | wc -l) cached debs into chroot apt cache"
            sudo mkdir -p rootfs/var/cache/apt/archives
            sudo cp sources/rootfs-apt-${{ matrix.arch }}/*.deb rootfs/var/cache/apt/archives/
          else
            echo "[*] No cached rootfs debs found - apt will download fresh"
          fi

      - name: Seed firmware debs into chroot apt cache
        run: |
          if [ -d "sources/firmware-${{ matrix.arch }}" ] && \
             [ "$(ls -A sources/firmware-${{ matrix.arch }}/*.deb 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "[*] Seeding $(ls sources/firmware-${{ matrix.arch }}/*.deb | wc -l) cached firmware debs into chroot apt cache"
            sudo mkdir -p rootfs/var/cache/apt/archives
            sudo cp sources/firmware-${{ matrix.arch }}/*.deb rootfs/var/cache/apt/archives/
          else
            echo "[*] No cached firmware debs found - apt will download fresh"
          fi

      ########## Install shared + initrd packages ##########
      - name: Install runtime packages
        run: |
          sudo cp build/shared_packages.txt rootfs/root/shared_packages.txt
          sudo cp build/initrd_packages.txt rootfs/root/initrd_packages.txt
          sudo chroot rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            echo 'deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware' > /etc/apt/sources.list
            apt-get update
            grep -v '^\s*#' /root/shared_packages.txt | grep -v '^\s*$' | tr -d '\r' > /root/install.txt
            grep -v '^\s*#' /root/initrd_packages.txt | grep -v '^\s*$' | tr -d '\r' >> /root/install.txt
            apt-get install -y --no-install-recommends \$(cat /root/install.txt)
            apt-get clean
          "

      ########## Apply overlay ##########
      - name: Apply overlay
        run: |
          sudo rsync -a --chown=root:root overlay/ rootfs/

      ########## Fix overlay permissions ##########
      - name: Fix overlay permissions
        run: |
          sudo chmod +x rootfs/usr/local/bin/hwcollect.sh
          sudo chmod +x rootfs/usr/local/bin/smbupload.sh
          sudo chmod +x rootfs/usr/local/bin/spejder-hostname.sh
          sudo chmod +x rootfs/usr/local/bin/spejder-keyboard.sh
          sudo chmod +x rootfs/etc/profile.d/spejder-keyboard.sh

      ########## Generate locales ##########
      - name: Generate locales
        run: |
          sudo cp shared/locale.gen rootfs/etc/locale.gen
          sudo chroot rootfs /bin/bash -c "
            locale-gen
            update-locale LANG=en_GB.UTF-8 LC_ALL=en_GB.UTF-8
          "
          echo "[*] Verifying generated locale data:"
          sudo ls -lah rootfs/usr/lib/locale/

      ########## Strip locales package (keep generated data) ##########
      # Back up the generated locale data before removing the package
      # postrm scripts on Trixie remove /usr/lib/locale/ contents on package removal
      - name: Strip locales package
        run: |
          echo "[*] Backing up generated locale data..."
          sudo cp -a rootfs/usr/lib/locale rootfs/usr/lib/locale.bak
          sudo chroot rootfs /bin/bash -c "
            apt-get remove -y locales
            apt-get autoremove -y
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          "
          echo "[*] Restoring locale data..."
          sudo rm -rf rootfs/usr/lib/locale
          sudo mv rootfs/usr/lib/locale.bak rootfs/usr/lib/locale
          echo "[*] Verifying locale data survived strip:"
          sudo ls -lah rootfs/usr/lib/locale/

      ########## Machine ID - write uninitialized so each machine generates its own on first boot ##########
      # systemd-machine-id-setup would commit a build-time ID shared across all deployments
      # Writing "uninitialized" causes systemd to generate a unique ID on first boot per machine
      - name: Set machine-id to uninitialized
        run: |
          echo "uninitialized" | sudo tee rootfs/etc/machine-id > /dev/null
          echo "[*] machine-id set to uninitialized - will be generated uniquely on first boot"

      ########## Install kernel package ##########
      - name: Install kernel package
        run: |
          sudo cp "${{ matrix.kernel_deb }}" rootfs/root/
          sudo chroot rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            echo '[*] Installing initramfs-tools to satisfy kernel dependency...'
            apt-get install -y --no-install-recommends initramfs-tools
            echo '[*] Installing kernel package...'
            dpkg -i /root/${{ matrix.kernel_deb }}
            echo '[*] Verifying kernel package state:'
            dpkg -l linux-image-6.12.73+deb13-${{ matrix.arch }}
          "
          echo "[*] Module tree from outside chroot:"
          sudo find rootfs/lib/modules/ -maxdepth 2 -type d 2>/dev/null || echo "No module dirs found"

      ########## Verify kernel modules ##########
      - name: Verify kernel modules
        run: |
          MODULE_COUNT=$(sudo find rootfs/lib/modules/ -name '*.ko*' 2>/dev/null | wc -l)
          echo "[*] Kernel module count: ${MODULE_COUNT}"
          if [ "${MODULE_COUNT}" -lt 100 ]; then
            echo "[!] ERROR: only ${MODULE_COUNT} kernel modules found - kernel install likely failed"
            echo "[!] Expected 100+ .ko files under rootfs/lib/modules/"
            exit 1
          fi
          echo "[*] Kernel module verification passed"

      ########## Generate module dependencies ##########
      - name: Generate depmod
        run: |
          sudo chroot rootfs depmod -a "${{ matrix.kernel_version }}"

      ########## Remove duplicate boot kernel ##########
      - name: Remove embedded boot kernel
        run: |
          sudo rm -f rootfs/boot/vmlinuz-* || true
          sudo rm -f rootfs/boot/initrd.img-* || true

      ########## Strip initramfs-tools after depmod - bypass postrm hooks to prevent kernel cascade removal ##########
      # apt-get remove triggers postrm hooks that cascade-remove the kernel via update-initramfs
      # dpkg --remove --no-triggers bypasses that chain entirely
      # Modules in /lib/modules/ are NOT owned by initramfs-tools so they survive
      - name: Strip initramfs-tools
        run: |
          sudo chroot rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            echo '[*] Stripping initramfs-tools without triggering postrm cascade...'
            dpkg --remove --force-remove-reinstreq --no-triggers \
              initramfs-tools initramfs-tools-core initramfs-tools-bin \
              cpio dracut-install klibc-utils libklibc logsave 2>/dev/null || true
            apt-get autoremove -y 2>/dev/null || true
            apt-get clean
            echo '[*] Verifying kernel still intact:'
            dpkg -l linux-image-6.12.73+deb13-${{ matrix.arch }} || true
            echo '[*] Verifying modules still present:'
            find /lib/modules/ -name '*.ko*' | wc -l
          "

      ########## Enable services ##########
      - name: Enable services
        run: |
          sudo chroot rootfs systemctl enable ssh || sudo chroot rootfs systemctl enable sshd || true
          sudo chroot rootfs systemctl enable systemd-networkd
          sudo chroot rootfs systemctl enable haveged
          sudo chroot rootfs systemctl enable hwcollect.service
          sudo chroot rootfs systemctl enable serial-getty@ttyS0.service
          sudo chroot rootfs systemctl enable spejder-hostname.service
          sudo chroot rootfs systemctl set-default multi-user.target
          sudo chroot rootfs systemctl mask apt-daily.timer
          sudo chroot rootfs systemctl mask apt-daily-upgrade.timer
          sudo chroot rootfs systemctl mask dpkg-db-backup.timer
          sudo chroot rootfs systemctl mask fstrim.timer
          sudo chroot rootfs systemctl mask ldconfig.service
          sudo chroot rootfs systemctl mask systemd-firstboot.service
          sudo chroot rootfs systemctl mask ipmievd.service

      ########## Write installed package manifest ##########
      - name: Write installed package manifest
        run: |
          sudo chroot rootfs /bin/bash -c "dpkg -l" | sudo tee rootfs/root/installed-manifest.txt > /dev/null
          echo "[*] Manifest written - $(sudo grep -c '^ii' rootfs/root/installed-manifest.txt) packages installed"

      ########## Cleanup ##########
      - name: Cleanup image
        run: |
          sudo chroot rootfs /bin/bash -c "
            apt-get autoremove -y
            apt-get clean
            rm -rf /var/lib/apt/lists/*
            rm -f /root/shared_packages.txt /root/initrd_packages.txt /root/install.txt
            echo '[*] Removing kernel deb from /root (~103MB saving)...'
            rm -f /root/linux-image-*.deb
            echo '[*] Running localepurge (keeping en_GB, da_DK, de_DE)...'
            DEBIAN_FRONTEND=noninteractive localepurge --config /etc/locale.nopurge 2>/dev/null || localepurge 2>/dev/null || true
            echo '[*] /usr/share/locale after purge:'
            du -sh /usr/share/locale 2>/dev/null || true
            echo '[*] Stripping man pages...'
            rm -rf /usr/share/man
            echo '[*] Stripping docs...'
            rm -rf /usr/share/doc
            echo '[*] Final rootfs size breakdown:'
            du -h --max-depth=1 / 2>/dev/null | sort -rh | head -20
          "

      ########## Unmount chroot filesystems ##########
      - name: Unmount chroot filesystems
        run: |
          sudo umount rootfs/dev/pts || true
          sudo umount rootfs/dev || true
          sudo umount rootfs/proc || true
          sudo umount rootfs/sys || true

      ########## Copy rootfs ##########
      - name: Copy rootfs
        run: |
          sudo rsync -aHAX --numeric-ids --exclude=/proc/* --exclude=/sys/* --exclude=/dev/* --exclude=/run/* --exclude=/tmp/* rootfs/ initrd-tree/

      ########## Install /init symlink to systemd ##########
      - name: Install init symlink
        run: |
          if [ -f "initrd-tree/usr/lib/systemd/systemd" ]; then
            sudo ln -sf /usr/lib/systemd/systemd initrd-tree/init
          elif [ -f "initrd-tree/lib/systemd/systemd" ]; then
            sudo ln -sf /lib/systemd/systemd initrd-tree/init
          else
            echo "[!] ERROR: cannot locate systemd binary in initrd-tree"
            exit 1
          fi
          echo "[*] /init symlink:"
          sudo ls -la initrd-tree/init

      ########## Runtime directories ##########
      - name: Create runtime directories
        run: |
          sudo mkdir -p initrd-tree/run
          sudo mkdir -p initrd-tree/tmp
          sudo mkdir -p initrd-tree/root
          sudo mkdir -p initrd-tree/run/sshd
          sudo mkdir -p initrd-tree/var/run/sshd
          sudo mkdir -p initrd-tree/sys/fs/cgroup

      ########## Device nodes ##########
      - name: Create device nodes
        run: |
          sudo mkdir -p initrd-tree/dev
          sudo mknod -m 622 initrd-tree/dev/console c 5 1 || true
          sudo mknod -m 666 initrd-tree/dev/null c 1 3 || true
          sudo mknod -m 666 initrd-tree/dev/tty c 5 0 || true

      ########## Build initramfs ##########
      ########## Build initramfs ##########
      # zstd -3 gives better compression than gzip with minimal decompression memory (~2MB vs 64MB at -19)
      # Requires minimum ~2GB RAM on target - bare metal servers have this comfortably
      # Kernel 6.12 has CONFIG_RD_ZSTD=y
      - name: Build initramfs
        run: |
          cd initrd-tree
          sudo find . -print0 | sudo cpio --null -ov --format=newc | sudo zstd -3 -T0 | sudo tee ../initramfs-${{ matrix.arch }}.cpio.zst > /dev/null
          echo "[*] initramfs size: $(ls -lh ../initramfs-${{ matrix.arch }}.cpio.zst | awk '{print $5}')"

      ########## Organise artifacts into spejder/${ipxe_arch}/ structure ##########
      - name: Organise artifacts
        run: |
          mkdir -p spejder/${{ matrix.ipxe_arch }}
          cp initramfs-${{ matrix.arch }}.cpio.zst spejder/${{ matrix.ipxe_arch }}/initramfs-${{ matrix.ipxe_arch }}.cpio.zst
          cp linux-${{ matrix.arch }} spejder/${{ matrix.ipxe_arch }}/linux-${{ matrix.ipxe_arch }}
          echo "[*] Artifact layout:"
          ls -lh spejder/${{ matrix.ipxe_arch }}/

      ########## Upload artifacts ##########
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-${{ matrix.arch }}
          path: |
            spejder/${{ matrix.ipxe_arch }}/linux-${{ matrix.ipxe_arch }}
            spejder/${{ matrix.ipxe_arch }}/initramfs-${{ matrix.ipxe_arch }}.cpio.zst

      ########## Publish release ##########
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          files: |
            spejder/${{ matrix.ipxe_arch }}/initramfs-${{ matrix.ipxe_arch }}.cpio.zst
            spejder/${{ matrix.ipxe_arch }}/linux-${{ matrix.ipxe_arch }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
