name: Build Hook Appliance

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  HOOK_VERSION: v0.11.1

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout appliance repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Show Docker info
        run: |
          docker version
          docker buildx version
      - name: Clone Hook
        run: |
          git clone https://github.com/tinkerbell/hook.git
      - name: Checkout Hook version
        run: |
          cd hook
          git checkout ${HOOK_VERSION}
      - name: Inject inventory script
        run: |
          cp overlay/inventory.sh hook/images/hook-embedded/
          chmod +x hook/images/hook-embedded/inventory.sh

      ## Hook kernel Dockerfile currently misses `make`
      ## on newer Debian toolchains.
      - name: Patch Hook kernel builder
        run: |
          cd hook
          sed -i 's/crossbuild-essential-arm64/crossbuild-essential-arm64 make/' kernel/Dockerfile

      ## Build kernel locally to avoid broken upstream manifests
      - name: Build kernel locally
        run: |
          cd hook
          ./build.sh kernel hook-default-${{ matrix.arch }}
      - name: Build Hook appliance
        run: |
          cd hook
          ./build.sh build hook-default-${{ matrix.arch }}
      - name: Verify outputs
        run: |
          ls -lah hook/out/linuxkit-hook-default-${{ matrix.arch }}/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-${{ matrix.arch }}
          path: |
            hook/out/linuxkit-hook-default-${{ matrix.arch }}/hook-kernel
            hook/out/linuxkit-hook-default-${{ matrix.arch }}/hook-initrd.img
            hook/out/linuxkit-hook-default-${{ matrix.arch }}/hook-cmdline
          if-no-files-found: error
