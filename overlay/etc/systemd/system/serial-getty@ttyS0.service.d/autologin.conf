[Service]
# Version history:
# 0.1.0 - Initial override for Spejder provisioning runtime
#          Autologin root on ttyS0 at 115200 baud
#          Empty ExecStart= required to clear the template default before setting our own
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noreset --keep-baud 115200,57600,38400,9600 %I $TERM
